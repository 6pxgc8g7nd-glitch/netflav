<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NF MOBILE ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #141414;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --icon-size: 20px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 呼吸燈動畫 - 用於標題 Logo */
        @keyframes pulse-status {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px var(--nf-red)); }
            50% { opacity: 0.4; filter: drop-shadow(0 0 10px var(--nf-red)); }
        }
        .brand-logo.paused { animation: pulse-status 1.5s infinite !important; color: #ff5e5e; }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* 區段式頁碼樣式 */
        .page-segment-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; padding: 30px 0; color: #71717a; font-weight: bold;
        }
        .page-btn {
            background: #1a1a1e; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; transition: all 0.2s; border: 1px solid #333;
        }
        .page-btn:active { background: #333; transform: scale(0.9); }
        .page-btn.disabled { opacity: 0.1; pointer-events: none; }

        /* 其他原有樣式整合 */
        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
        }
        .brand-logo { color: var(--nf-red); font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #71717a; transition: color 0.2s; height: 100%;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; line-height: 1; }
        .nav-item svg { width: var(--icon-size); height: var(--icon-size); }

        .poster-card {
            position: relative; background: #111; border-radius: 8px; overflow: hidden;
            aspect-ratio: 16 / 9; width: 100%; margin-bottom: 8px;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
            pointer-events: none;
        }
        .action-circle-btn {
            position: absolute; width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 20; border: 1px solid rgba(255, 255, 255, 0.15); color: white;
        }
        .card-edit-btn { top: 10px; right: 10px; }
        .card-play-btn { bottom: 10px; right: 10px; }

        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background-color: var(--nf-black); transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; overflow-y: auto; padding: 25px;
        }
        .drawer.open { transform: translateY(0); }

        .search-container { position: relative; margin-bottom: 1.5rem; }
        .search-input { width: 100%; background-color: #18181b; border: none; border-radius: 8px; padding: 0.85rem 1rem 0.85rem 3rem; font-size: 0.875rem; color: white; outline: none; }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: var(--icon-size); height: var(--icon-size); color: #71717a; pointer-events: none; }

        #authOverlay { position: fixed; inset: 0; background-color: var(--nf-black); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .stealth-toggle { margin-top: 2rem; display: flex; align-items: center; gap: 8px; font-size: 10px; color: #444; text-transform: uppercase; cursor: pointer; }
        .stealth-toggle input { display: none; }
        .stealth-toggle .box { width: 12px; height: 12px; border: 1px solid #333; border-radius: 2px; position: relative; }
        .stealth-toggle input:checked + .box::after { content: ''; position: absolute; inset: 2px; background: var(--nf-red); }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo mb-10 tracking-widest">Netflav</h1>
        <div id="patternContainer">
            <canvas id="patternCanvas" width="300" height="300"></canvas>
        </div>
        <p id="authHint" class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">請繪製圖形解鎖</p>
        <label class="stealth-toggle">
            <input type="checkbox" id="stealthMode">
            <div class="box"></div>
            <span>隱形繪製模式</span>
        </label>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="brand-logo" id="logoTitle" onclick="switchTab(0)">Netflav</div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            <div id="page1" class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded tracking-tighter">0 ITEMS</span>
                </div>
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋..." class="search-input">
                </div>
                <div id="gallery" class="grid grid-cols-1 gap-4"></div>
                <div id="paginationContainer"></div>
            </div>
            <div id="page2" class="page-content"><div id="tagCloud" class="flex flex-wrap gap-3"></div></div>
            <div id="page3" class="page-content"><div id="actorList" class="grid grid-cols-3 gap-y-10"></div></div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" onclick="switchTab(0)"><span>首頁</span></div>
        <div class="nav-item" onclick="switchTab(1)"><span>標籤</span></div>
        <div class="nav-item" onclick="switchTab(2)"><span>演員</span></div>
        <div class="nav-item" onclick="openDrawer()"><span>新增</span></div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)"><span>設定</span></div>
    </nav>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 transition-all pointer-events-none"></div>

    <script>
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        const CORRECT_PATTERN = "0124678";
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentPage = 1, pageSize = 12, currentId = null;

        // --- 自動登出與標題呼吸燈邏輯 ---
        let logoutTimer = null;
        let isAutoLogoutPaused = false;
        const AUTO_LOGOUT_SECONDS = 300; 

        function resetLogoutTimer() {
            if (isAutoLogoutPaused || document.getElementById('authOverlay').style.display !== 'none') {
                if (logoutTimer) clearTimeout(logoutTimer);
                return;
            }
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => { lockApp(); showToast("已自動登出"); }, AUTO_LOGOUT_SECONDS * 1000);
        }

        const logo = document.getElementById('logoTitle');
        let pressTimer;
        logo.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => {
                isAutoLogoutPaused = !isAutoLogoutPaused;
                logo.classList.toggle('paused', isAutoLogoutPaused);
                showToast(isAutoLogoutPaused ? "🔒 暫停自動登出" : "🕒 啟用自動登出");
                resetLogoutTimer();
            }, 800);
        });
        logo.addEventListener('touchend', () => clearTimeout(pressTimer));
        ['mousedown', 'touchstart', 'scroll'].forEach(evt => window.addEventListener(evt, resetLogoutTimer, {passive:true}));

        // --- 區段式頁碼渲染 ---
        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if (total <= 1) { container.innerHTML = ""; return; }
            container.innerHTML = `
                <div class="page-segment-nav">
                    <div class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})">PREV</div>
                    <div class="text-white text-sm tracking-widest">
                        <span class="text-red-600">${currentPage}</span> / ${total}
                    </div>
                    <div class="page-btn ${currentPage === total ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})">NEXT</div>
                </div>
            `;
        }

        function changePage(p) {
            currentPage = p;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderGallery();
        }

        // --- 核心渲染功能 ---
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => i.name.toLowerCase().includes(query) || (i.code||"").toLowerCase().includes(query));
            
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            const total = Math.ceil(filtered.length / pageSize);
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card">
                    <img src="${item.img || 'https://via.placeholder.com/640x360'}" loading="lazy">
                    <div class="action-circle-btn card-edit-btn" onclick="openDrawer('${item.id}')">
                         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </div>
                    <div class="card-overlay">
                        <p class="text-[9px] font-black text-red-600 mb-0.5 tracking-wider uppercase">${item.code || 'SERIES'}</p>
                        <p class="text-[13px] font-bold truncate">${item.name}</p>
                    </div>
                </div>
            `).join('');
            renderPagination(total);
        }

        // --- 解鎖邏輯 ---
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const nodes = [];
        for(let i=0; i<3; i++) for(let j=0; j<3; j++) nodes.push({id:(i*3+j).toString(), x:50+j*100, y:50+i*100});
        let selected = [], isDrawing = false;

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; selected = []; });
        canvas.addEventListener('touchmove', (e) => {
            if(!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
            nodes.forEach(n => {
                if(Math.hypot(x-n.x, y-n.y) < 30 && !selected.includes(n.id)) {
                    selected.push(n.id);
                    if(navigator.vibrate) navigator.vibrate(10);
                }
            });
        });
        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            if(selected.join('') === CORRECT_PATTERN) {
                unlockVault();
            } else {
                document.getElementById('patternContainer').classList.add('shake');
                setTimeout(()=>document.getElementById('patternContainer').classList.remove('shake'), 400);
            }
        });

        function unlockVault() {
            sessionStorage.setItem('VAULT_UNLOCKED', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            document.getElementById('bottomNav').style.visibility = 'visible';
            renderGallery();
            resetLogoutTimer();
        }

        function lockApp() {
            sessionStorage.removeItem('VAULT_UNLOCKED');
            location.reload();
        }

        function switchTab(index) {
            document.getElementById('pageContainer').style.transform = `translateX(-${index * (100/3)}%)`;
            document.querySelectorAll('.nav-item').forEach((n, i) => n.classList.toggle('active', i === index));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        function debouncedRender() { 
            currentPage = 1; 
            clearTimeout(window.timer); 
            window.timer = setTimeout(renderGallery, 300); 
        }

        window.onload = () => { if(sessionStorage.getItem('VAULT_UNLOCKED') === 'true') unlockVault(); };
    </script>
</body>
</html>
