<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Netflav - Vault Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-red: #E50914;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: white;
            margin: 0; padding: 0;
            user-select: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 演員頭像：簡約風格 --- */
        .actor-badge { 
            background: #1a1a1a; border-radius: 50%; width: 70px; height: 70px; 
            margin: 0 auto 8px; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
        }
        .actor-initials { font-size: 22px; font-weight: 700; color: #ddd; }

        /* --- 佈局控制 --- */
        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; }

        /* --- 導航與標頭 --- */
        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }

        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #555; }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; margin-top: 4px; font-weight: 600; }

        /* --- 重複檢查告警 --- */
        .input-error { color: #ff4444 !important; border: 1px solid #ff4444 !important; }
        .error-hint { color: #ff4444; font-size: 10px; margin-top: 4px; display: none; }

        /* --- 卡片 --- */
        .poster-card { position: relative; background: #111; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }

        .drawer { position: fixed; inset: 0; background: var(--nf-black); transform: translateY(100%); transition: transform 0.4s ease; z-index: 2000; padding: 25px; overflow-y: auto; }
        .drawer.open { transform: translateY(0); }
        
        #patternCanvas { touch-action: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body class="overflow-hidden">

    <div id="authOverlay" class="fixed inset-0 bg-black z-[5000] flex flex-col items-center justify-center">
        <h1 class="text-red-600 text-3xl font-black tracking-tighter mb-12">NETFLAV</h1>
        <canvas id="patternCanvas" width="300" height="300"></canvas>
        <p class="text-zinc-600 text-[10px] tracking-[0.4em] mt-8">請繪製解鎖圖形</p>
    </div>

    <header class="mobile-header invisible" id="mainHeader">
        <div class="absolute left-5" onclick="toggleAutoLogout()"><span id="statusLed" class="w-2 h-2 rounded-full inline-block bg-green-500"></span></div>
        <div class="text-red-600 text-xl font-black tracking-tighter" onclick="refreshAndHome()">NETFLAV</div>
    </header>

    <div id="appContent" class="page-overflow-wrapper invisible">
        <div class="page-container" id="pageContainer">
            <div class="page-content">
                <div class="flex justify-between items-baseline mb-4">
                    <h2 class="text-lg font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500">0 ITEMS</span>
                </div>
                <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋..." class="w-full bg-zinc-900 rounded-lg py-3 px-4 text-sm mb-6 outline-none">
                <div id="gallery" class="grid gap-4"></div>
                <div id="paginationContainer" class="mt-8 flex flex-col items-center gap-4"></div>
            </div>

            <div class="page-content">
                <h2 class="text-xl font-bold mb-6">探索標籤</h2>
                <div id="tagCloud" class="flex flex-wrap gap-2"></div>
            </div>
            
            <div class="page-content">
                <h2 class="text-xl font-bold mb-6">演員名單</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav invisible" id="bottomNav">
        <div class="nav-item active" onclick="switchTab(0)"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>首頁</span></div>
        <div class="nav-item" onclick="switchTab(1)"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path></svg><span>標籤</span></div>
        <div class="nav-item" onclick="switchTab(2)"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>演員</span></div>
        <div class="nav-item" onclick="openDrawer()"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>新增</span></div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>設定</span></div>
    </nav>

    <div id="drawer" class="drawer">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">影片詳細資訊</h3>
            <button onclick="closeDrawer()"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="space-y-4">
            <div>
                <input type="text" id="nameInput" placeholder="名稱" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            </div>
            <div>
                <input type="text" id="codeInput" oninput="validateInput(this, 'code')" placeholder="番號 (不能重複)" class="w-full bg-zinc-900 p-4 rounded-lg outline-none transition-colors">
                <p id="codeError" class="error-hint">此番號已存在於庫中</p>
            </div>
            <div>
                <input type="text" id="urlInput" oninput="validateInput(this, 'url')" placeholder="影片連結 (不能重複)" class="w-full bg-zinc-900 p-4 rounded-lg outline-none transition-colors">
                <p id="urlError" class="error-hint">此連結已重複</p>
            </div>
            <div>
                <input type="text" id="tagsInput" placeholder="標籤 (以空白分隔)" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            </div>
            <div>
                <input type="text" id="imgInput" oninput="validateInput(this, 'img')" placeholder="封面圖片 URL (不能重複)" class="w-full bg-zinc-900 p-4 rounded-lg outline-none transition-colors">
                <p id="imgError" class="error-hint">封面網址已重複</p>
            </div>
            <button id="saveBtn" onclick="saveItem()" class="w-full bg-red-600 py-4 font-black rounded-lg mt-4 disabled:opacity-30 disabled:bg-zinc-800" disabled>儲存</button>
            <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full text-zinc-600 text-xs py-2 hidden">刪除項目</button>
        </div>
    </div>

    <div id="filterDrawer" class="drawer">
        <h3 class="text-xl font-bold mb-8">帳戶與顯示</h3>
        <div class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-lg">
                <p class="text-[10px] text-zinc-500 font-bold mb-3 uppercase">網格顯示</p>
                <div class="flex gap-2">
                    <button id="layoutBtn1" onclick="updateLayout(1)" class="flex-1 py-3 rounded text-xs font-bold">單欄</button>
                    <button id="layoutBtn2" onclick="updateLayout(2)" class="flex-1 py-3 rounded text-xs font-bold">雙欄</button>
                </div>
            </div>
            <button onclick="exportData()" class="w-full py-4 bg-zinc-900 rounded font-bold">匯出 JSON 備份</button>
            <label class="block w-full py-4 bg-zinc-900 rounded font-bold text-center">匯入備份數據 <input type="file" class="hidden" accept=".json" onchange="importData(event)"></label>
            <button onclick="lockApp()" class="w-full py-4 text-red-600 font-bold">安全登出</button>
            <button onclick="toggleFilterDrawer(false)" class="w-full py-4 text-zinc-500 text-sm">關閉</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-8 text-center">
        <div><h4 class="text-xl font-bold mb-8">確定刪除此內容？</h4><button onclick="executeDelete()" class="w-64 bg-red-600 py-4 font-bold rounded-lg mb-4">確認刪除</button><button onclick="closeConfirm()" class="block w-full text-zinc-500">取消</button></div>
    </div>
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 pointer-events-none transition-all"></div>

    <script>
        const STORAGE_KEY = 'NF_PRO_VAULT';
        const CORRECT_PATTERN = "0124678";
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null, currentPage = 1, pageSize = 12;
        let isDrawing = false, selectedNodes = [], isErrorState = false;
        let currentLayout = parseInt(localStorage.getItem('NF_LAYOUT')) || 1;
        
        // --- 密碼鎖 ---
        const nodes = [];
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) nodes.push({ id: (i * 3 + j).toString(), x: 50 + j * 100, y: 50 + i * 100 });

        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            if (selectedNodes.length > 0) {
                ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = isErrorState ? '#ff4444' : '#E50914';
                const s = nodes.find(n => n.id === selectedNodes[0]); ctx.moveTo(s.x, s.y);
                selectedNodes.slice(1).forEach(id => { const n = nodes.find(node => node.id === id); ctx.lineTo(n.x, n.y); });
                ctx.stroke();
            }
            nodes.forEach(n => {
                ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI*2);
                ctx.fillStyle = selectedNodes.includes(n.id) ? (isErrorState ? '#ff4444' : '#E50914') : '#333'; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();

        const getPos = e => {
            const r = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: (t.clientX - r.left) * (300/r.width), y: (t.clientY - r.top) * (300/r.height) };
        };
        const handleStart = e => { e.preventDefault(); isDrawing = true; selectedNodes = []; isErrorState = false; };
        const handleMove = e => {
            if (!isDrawing || isErrorState) return;
            const p = getPos(e);
            nodes.forEach(n => {
                if (Math.hypot(p.x - n.x, p.y - n.y) < 25 && !selectedNodes.includes(n.id)) selectedNodes.push(n.id);
            });
        };
        const handleEnd = () => {
            if (!isDrawing) return; isDrawing = false;
            if (selectedNodes.join('') === CORRECT_PATTERN) unlockVault();
            else { isErrorState = true; setTimeout(() => { selectedNodes = []; isErrorState = false; }, 500); }
        };
        canvas.addEventListener('touchstart', handleStart); canvas.addEventListener('touchmove', handleMove); canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);

        // --- 重複檢查邏輯 ---
        function validateInput(el, field) {
            const val = el.value.trim().toLowerCase();
            const errorEl = document.getElementById(field + 'Error');
            
            // 排除正在編輯的項目本身
            const isDuplicate = collections.some(item => 
                String(item.id) !== String(currentId) && 
                item[field] && item[field].toLowerCase() === val && val !== ""
            );

            if (isDuplicate) {
                el.classList.add('input-error');
                errorEl.style.display = 'block';
            } else {
                el.classList.remove('input-error');
                errorEl.style.display = 'none';
            }
            checkFormValidity();
        }

        function checkFormValidity() {
            const hasErrors = document.querySelectorAll('.input-error').length > 0;
            const nameFilled = document.getElementById('nameInput').value.trim() !== "";
            document.getElementById('saveBtn').disabled = hasErrors || !nameFilled;
        }

        // --- 核心 App 功能 ---
        function unlockVault() {
            sessionStorage.setItem('LOCKED', 'false');
            document.getElementById('authOverlay').style.display = 'none';
            document.body.classList.remove('overflow-hidden');
            ['mainHeader', 'appContent', 'bottomNav'].forEach(id => document.getElementById(id).classList.remove('invisible'));
            updateLayout(currentLayout);
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => i.name.toLowerCase().includes(q) || (i.code || "").toLowerCase().includes(q));
            
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            gallery.className = `grid gap-4 ${currentLayout === 2 ? 'grid-cols-2' : 'grid-cols-1'}`;
            
            const start = (currentPage - 1) * pageSize;
            const paginated = filtered.slice(start, start + pageSize);
            
            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card" onclick="openDrawer('${item.id}')">
                    <img src="${item.img || 'https://via.placeholder.com/400x225/111/333?text=No+Image'}" loading="lazy">
                    <div class="card-overlay">
                        <p class="text-[9px] font-black text-red-600 tracking-wider">${item.code || 'SERIES'}</p>
                        <p class="text-xs font-bold truncate">${item.name}</p>
                    </div>
                </div>
            `).join('');
            renderSectionPagination(filtered.length);
        }

        // --- 區段式分頁 (Section Pagination) ---
        function renderSectionPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / pageSize);
            const container = document.getElementById('paginationContainer');
            if (totalPages <= 1) { container.innerHTML = ""; return; }

            const sectionSize = 5;
            const currentSection = Math.ceil(currentPage / sectionSize);
            const startPage = (currentSection - 1) * sectionSize + 1;
            const endPage = Math.min(startPage + sectionSize - 1, totalPages);

            let html = `<div class="flex items-center gap-1">`;
            
            if (currentSection > 1) {
                html += `<button onclick="goToPage(${startPage - 1})" class="w-8 h-8 flex items-center justify-center bg-zinc-900 rounded-full text-zinc-500">«</button>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="w-8 h-8 flex items-center justify-center rounded-full text-xs font-bold ${i === currentPage ? 'bg-red-600 text-white' : 'bg-zinc-900 text-zinc-400'}">${i}</button>`;
            }

            if (endPage < totalPages) {
                html += `<button onclick="goToPage(${endPage + 1})" class="w-8 h-8 flex items-center justify-center bg-zinc-900 rounded-full text-zinc-500">»</button>`;
            }

            html += `</div><p class="text-[10px] text-zinc-600">頁面 ${currentPage} / ${totalPages}</p>`;
            container.innerHTML = html;
        }

        function goToPage(p) { currentPage = p; renderGallery(); window.scrollTo(0,0); }

        function openDrawer(id = null) {
            currentId = id;
            document.getElementById('drawer').classList.add('open');
            const inputs = ['nameInput','codeInput','urlInput','tagsInput','imgInput'];
            const errorHints = ['codeError','urlError','imgError'];
            
            inputs.forEach(k => {
                const el = document.getElementById(k);
                el.classList.remove('input-error');
                el.value = "";
            });
            errorHints.forEach(k => document.getElementById(k).style.display = 'none');

            if(id) {
                const item = collections.find(i => String(i.id) === String(id));
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
            } else {
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
            checkFormValidity();
        }

        function saveItem() {
            const data = {
                id: currentId || Date.now().toString(),
                name: document.getElementById('nameInput').value.trim(),
                code: document.getElementById('codeInput').value.trim().toUpperCase(),
                url: document.getElementById('urlInput').value.trim(),
                tags: document.getElementById('tagsInput').value.split(/\s+/).filter(t=>t),
                img: document.getElementById('imgInput').value.trim()
            };
            if(currentId) collections[collections.findIndex(i => String(i.id) === String(currentId))] = data;
            else collections.unshift(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery(); closeDrawer(); showToast("儲存成功");
        }

        // --- 其他工具 ---
        function switchTab(idx) {
            document.getElementById('pageContainer').style.transform = `translateX(-${idx * 33.3333}%)`;
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === idx));
            if (idx === 1) renderTags();
            if (idx === 2) renderActors();
        }

        function renderTags() {
            const map = {}; collections.forEach(i => (i.tags || []).forEach(t => map[t] = (map[t] || 0) + 1));
            document.getElementById('tagCloud').innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([t, c]) => `
                <div onclick="filterByTag('${t}')" class="bg-zinc-900 px-4 py-2 rounded-full text-xs">${t} <span class="text-zinc-600 ml-1">${c}</span></div>
            `).join('');
        }

        function renderActors() {
            const map = {};
            collections.forEach(i => {
                const names = i.name.split(/[\s,，、/]+/).filter(n => n.length > 1 && !/[A-Z]+-\d+/.test(n));
                names.forEach(n => map[n] = (map[n] || 0) + 1);
            });
            document.getElementById('actorList').innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([n, c]) => `
                <div onclick="filterByTag('${n}')" class="flex flex-col items-center"><div class="actor-badge"><span class="actor-initials">${n[0]}</span></div><span class="text-[10px] font-bold text-zinc-400">${n}</span><span class="text-[8px] text-zinc-600">${c} 部</span></div>
            `).join('');
        }

        function filterByTag(t) { document.getElementById('searchInput').value = t; switchTab(0); renderGallery(); }
        function updateLayout(c) { currentLayout = c; localStorage.setItem('NF_LAYOUT', c); renderGallery(); }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
        function toggleFilterDrawer(o) { document.getElementById('filterDrawer').classList.toggle('open', o); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = 1; setTimeout(()=>t.style.opacity=0, 2000); }
        function exportData() { const b = new Blob([JSON.stringify(collections)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'vault.json'; a.click(); }
        function importData(e) { const r = new FileReader(); r.onload = ev => { collections = JSON.parse(ev.target.result); localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); renderGallery(); showToast("匯入完成"); }; r.readAsText(e.target.files[0]); }
        function lockApp() { sessionStorage.removeItem('LOCKED'); location.reload(); }
        function debouncedRender() { clearTimeout(window.t); window.t = setTimeout(renderGallery, 300); }
        function refreshAndHome() { document.getElementById('searchInput').value = ""; currentPage = 1; switchTab(0); renderGallery(); }

        window.onload = () => { if(sessionStorage.getItem('LOCKED') === 'false') unlockVault(); };
    </script>
</body>
</html>
