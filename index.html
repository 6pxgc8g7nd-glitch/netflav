<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE - Obsidian Gold Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,900;1,900&family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --mag-black: #0a0a0a;
            --mag-dark: #111111;
            --mag-white: #f0f0f0;
            --mag-accent: #c5a059;
            --mag-gray: #222222;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--mag-black);
            color: var(--mag-white);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .serif-bold { font-family: 'Noto Serif TC', serif; }
        .bodoni { font-family: 'Bodoni Moda', serif; }

        /* 啟動封面 */
        #landingCover {
            position: fixed;
            inset: 0;
            background-color: var(--mag-black);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #landingCover.hidden { transform: scale(1.1); opacity: 0; pointer-events: none; }

        /* 抽屜基礎樣式 */
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            background-color: #0d0d0d;
            border-left: 1px solid var(--mag-gray);
            box-shadow: -30px 0 80px rgba(0,0,0,0.9);
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }

        #filterDrawer { width: 320px; }
        #drawer { width: 100%; max-width: 600px; }

        /* 卡片設計 */
        .entry-card {
            background: var(--mag-dark);
            border: 1px solid var(--mag-gray);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .entry-card:hover {
            transform: translateY(-8px);
            border-color: var(--mag-accent);
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.15);
        }

        .media-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
            border-bottom: 1px solid var(--mag-gray);
        }
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .action-btn {
            height: 36px;
            padding: 0 16px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid var(--mag-gray);
            border-radius: 6px;
            color: var(--mag-accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .action-btn:hover { 
            background: var(--mag-accent); 
            color: #000; 
            border-color: var(--mag-accent);
        }

        /* 標籤過濾樣式 */
        .filter-tag {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255, 255, 255, 0.02);
            color: #888;
            transition: all 0.25s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .filter-tag.active {
            background: rgba(197, 160, 89, 0.15);
            color: var(--mag-accent);
            border-color: rgba(197, 160, 89, 0.4);
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            cursor: pointer;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--mag-accent); border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <!-- 啟動封面 -->
    <div id="landingCover">
        <div class="text-center px-6">
            <h1 class="text-6xl md:text-9xl serif-bold text-[#c5a059] leading-none mb-4">ARCHIVE</h1>
            <p class="bodoni text-lg italic text-zinc-500 tracking-[0.4em]">OBSIDIAN GOLD EDITION</p>
            <button id="enterBtn" onclick="enterVault()" class="mt-12 border border-[#c5a059] text-[#c5a059] px-12 py-4 text-[10px] font-black tracking-[0.5em] uppercase transition-all hover:bg-[#c5a059] hover:text-black">解密進入</button>
        </div>
    </div>

    <!-- 導航欄 -->
    <nav class="container mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center border-b border-zinc-900 gap-6">
        <div class="flex items-center gap-6">
            <button onclick="toggleFilterDrawer(true)" class="text-[#c5a059] hover:text-white transition-all">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="flex flex-col">
                <h2 class="serif-bold text-3xl text-white tracking-tighter">THE ARCHIVE<span class="text-[#c5a059]">.</span></h2>
                <span id="navStat" class="text-[9px] font-bold text-zinc-600 tracking-widest uppercase">Vault Ready</span>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-4">
                <button onclick="exportData()" class="text-[10px] font-bold text-zinc-500 hover:text-white transition-colors tracking-widest uppercase">匯出</button>
                <label class="text-[10px] font-bold text-zinc-500 hover:text-white transition-colors tracking-widest uppercase cursor-pointer">
                    匯入 <input type="file" id="importInput" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>
            <div class="h-4 w-[1px] bg-zinc-800 mx-2"></div>
            <button onclick="openDrawer()" class="bg-[#c5a059] text-black px-6 py-3 font-black text-[10px] tracking-[0.2em] uppercase hover:bg-white transition-all shadow-lg">
                + 新增檔案
            </button>
        </div>
    </nav>

    <!-- 主畫廊 -->
    <div class="container mx-auto px-6 mt-12">
        <main id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></main>
    </div>

    <!-- 黑色遮罩 -->
    <div id="overlay" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/90 opacity-0 pointer-events-none transition-opacity duration-500 z-50 backdrop-blur-md"></div>

    <!-- 篩選抽屜 -->
    <div id="filterDrawer" class="drawer p-8">
        <div class="flex justify-between items-center mb-10">
            <h3 class="serif-bold text-xl text-white uppercase tracking-widest">篩選中心</h3>
            <button onclick="toggleFilterDrawer(false)" class="text-zinc-500 hover:text-white">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="space-y-8">
            <div class="relative">
                <input type="text" id="searchInput" oninput="renderGallery(false)" placeholder="搜尋名稱、番號..." 
                    class="w-full bg-black/40 border border-zinc-800 rounded-lg p-3 pr-10 text-xs text-white outline-none focus:border-[#c5a059]">
                <span id="searchClearBtn" onclick="clearSearch()" class="search-clear hidden">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </span>
            </div>
            <div id="filterTagsContainer"></div>
            <div id="statInfo" class="text-[10px] font-bold text-zinc-600 tracking-widest uppercase text-center py-4 bg-black/40 rounded-xl border border-zinc-900">
                00 RECORDS FOUND
            </div>
        </div>
    </div>

    <!-- 編輯抽屜 -->
    <div id="drawer" class="drawer p-10">
        <div class="flex justify-between items-center mb-12">
            <h3 class="serif-bold text-4xl text-white">檔案編譯</h3>
            <button onclick="closeDrawer()" class="text-zinc-500 hover:text-white">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="space-y-8">
            <input type="text" id="nameInput" class="w-full bg-transparent border-b border-zinc-800 py-2 text-2xl text-white outline-none" placeholder="名稱">
            <input type="text" id="codeInput" class="w-full bg-transparent border-b border-zinc-800 py-2 text-white outline-none" placeholder="番號">
            <input type="text" id="tagsInput" class="w-full bg-transparent border-b border-zinc-800 py-2 text-white outline-none" placeholder="標籤 (以空格分隔)">
            <input type="text" id="imgInput" class="w-full bg-transparent border-b border-zinc-800 py-2 text-zinc-500 text-xs outline-none" placeholder="圖片 URL">
            <input type="text" id="urlInput" class="w-full bg-transparent border-b border-zinc-800 py-2 text-[#c5a059] text-xs outline-none" placeholder="外部連結">
            <button onclick="saveItem()" class="w-full bg-[#c5a059] text-black py-5 font-black uppercase tracking-widest hover:bg-white transition-all">保存變更</button>
            <button id="drawerDeleteBtn" onclick="deleteItem()" class="w-full text-zinc-700 text-[10px] uppercase font-bold hover:text-red-500 transition-colors hidden">永久刪除</button>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#c5a059] text-black px-10 py-4 text-[10px] font-black rounded-full opacity-0 transition-all z-[100] uppercase tracking-widest shadow-2xl">Notification</div>

    <script>
        const STORAGE_KEY = 'VAULT_OFFLINE_DATA_V1';
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null;
        let selectedFilterTags = new Set();

        function enterVault() {
            document.getElementById('landingCover').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function toggleFilterDrawer(open) {
            const drawer = document.getElementById('filterDrawer');
            const overlay = document.getElementById('overlay');
            if(open) {
                drawer.classList.add('open');
                overlay.classList.replace('opacity-0', 'opacity-100');
                overlay.classList.remove('pointer-events-none');
                renderTags();
            } else {
                drawer.classList.remove('open');
                if(!document.getElementById('drawer').classList.contains('open')) {
                    overlay.classList.replace('opacity-100', 'opacity-0');
                    overlay.classList.add('pointer-events-none');
                }
            }
        }

        function openDrawer(id = null) {
            currentId = id;
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.add('open');
            overlay.classList.replace('opacity-0', 'opacity-100');
            overlay.classList.remove('pointer-events-none');

            if(id) {
                const item = collections.find(i => i.id == id);
                document.getElementById('nameInput').value = item.name || "";
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
            } else {
                ['nameInput','codeInput','tagsInput','imgInput','urlInput'].forEach(k => document.getElementById(k).value = "");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            if(!document.getElementById('filterDrawer').classList.contains('open')) {
                document.getElementById('overlay').classList.replace('opacity-100', 'opacity-0');
                document.getElementById('overlay').classList.add('pointer-events-none');
            }
        }

        function closeAllDrawers() {
            toggleFilterDrawer(false);
            closeDrawer();
        }

        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            if(!name) return showToast("請輸入名稱");
            const data = {
                id: currentId || Date.now(),
                name,
                code: document.getElementById('codeInput').value.trim().toUpperCase(),
                tags: document.getElementById('tagsInput').value.split(/\s+/).filter(t => t),
                img: document.getElementById('imgInput').value.trim(),
                url: document.getElementById('urlInput').value.trim(),
                updatedAt: Date.now()
            };
            if(currentId) {
                const idx = collections.findIndex(i => i.id == currentId);
                collections[idx] = data;
            } else {
                collections.unshift(data);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery();
            closeDrawer();
            showToast("Vault Updated");
        }

        function deleteItem() {
            if(!confirm("確定要永久抹除此檔案？")) return;
            collections = collections.filter(i => i.id != currentId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery();
            closeDrawer();
            showToast("Record Erased");
        }

        function toggleTag(tag) {
            if(selectedFilterTags.has(tag)) selectedFilterTags.delete(tag);
            else selectedFilterTags.add(tag);
            renderTags();
            renderGallery(false);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = "";
            renderGallery(false);
        }

        function renderTags() {
            const tagCounts = {};
            collections.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
            const container = document.getElementById('filterTagsContainer');
            container.innerHTML = "";
            Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).forEach(tag => {
                const isActive = selectedFilterTags.has(tag);
                const btn = document.createElement('button');
                btn.className = `filter-tag ${isActive ? 'active' : ''}`;
                btn.innerHTML = `<span># ${tag}</span><span>${tagCounts[tag]}</span>`;
                btn.onclick = () => toggleTag(tag);
                container.appendChild(btn);
            });
        }

        function renderGallery(updateTags = true) {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('searchClearBtn').classList.toggle('hidden', query === "");
            if(updateTags) renderTags();

            const filtered = collections.filter(i => {
                const matchSearch = i.name.toLowerCase().includes(query) || (i.code || "").toLowerCase().includes(query);
                const matchTags = selectedFilterTags.size === 0 || (i.tags || []).some(t => selectedFilterTags.has(t));
                return matchSearch && matchTags;
            });

            document.getElementById('statInfo').innerText = `${filtered.length} RECORDS FOUND`;
            document.getElementById('navStat').innerText = `${collections.length} Total / ${filtered.length} Filtered`;

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "entry-card group";
                card.innerHTML = `
                    <div class="media-wrapper">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'}" onerror="this.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="serif-bold text-lg text-white mb-1 uppercase truncate">${item.name}</h3>
                        <p class="text-[10px] text-[#c5a059] font-mono mb-4">${item.code || "PRIVATE"}</p>
                        <div class="mt-auto flex gap-2 border-t border-zinc-900 pt-4">
                            <button onclick="openDrawer(${item.id})" class="action-btn flex-grow">編輯</button>
                            ${item.url ? `<button onclick="window.open('${item.url}', '_blank')" class="action-btn flex-grow">查看</button>` : ''}
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(collections, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `THE_ARCHIVE_DATA.json`;
            a.click();
            showToast("Database Exported");
        }

        // 重要：修復匯入邏輯
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    
                    if (!Array.isArray(importedData)) {
                        throw new Error("格式不正確");
                    }

                    if (confirm(`確認匯入 ${importedData.length} 筆資料？此動作會覆蓋現有數據。`)) {
                        collections = importedData;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
                        
                        // 清空目前篩選狀態以確保顯示正確
                        selectedFilterTags.clear();
                        document.getElementById('searchInput').value = "";
                        
                        // 全域重新渲染
                        renderGallery(true);
                        showToast("資料匯入成功");
                    }
                } catch (err) {
                    console.error("Import error:", err);
                    showToast("匯入失敗：檔案格式錯誤");
                } finally {
                    // 重置 input 以便下次選擇同一檔案時仍能觸發 change
                    e.target.value = "";
                }
            };

            reader.onerror = function() {
                showToast("讀取檔案時發生錯誤");
            };

            reader.readAsText(file);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 3000);
        }

        renderGallery();
    </script>
</body>
</html>
