    <script>
        // --- 核心變數與配置 ---
        const CORRECT_PATTERN = "0124678"; // 預設解鎖路徑
        const STORAGE_KEY = 'VAULT_OFFLINE_DATA_V1';
        const SESSION_AUTH_FLAG = 'VAULT_UNLOCKED';
        const IDLE_TIMEOUT = 5000; // 5秒自動鎖定 (可改為 30000 代表 30秒)
        
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null;
        let selectedFilterTags = new Set();
        let currentPage = 1;
        const pageSize = 12;
        let idleTimer; // 閒置計時器

        // --- 解鎖畫布邏輯 ---
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const patternBox = document.getElementById('patternBox');
        let isDrawing = false;
        let selectedNodes = [];
        let mousePos = { x: 0, y: 0 };
        const nodes = [];
        const nodeRadius = 12;
        const hitRadius = 35;

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                nodes.push({ id: (i * 3 + j).toString(), x: 60 + j * 100, y: 60 + i * 100 });
            }
        }

        // --- 自動鎖定監聽器 (全域) ---
        function resetIdleTimer() {
            if (sessionStorage.getItem(SESSION_AUTH_FLAG) === 'true') {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    if (sessionStorage.getItem(SESSION_AUTH_FLAG) === 'true') {
                        logout(); 
                    }
                }, IDLE_TIMEOUT);
            }
        }

        // 監聽各種互動行為來重設計時器
        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, resetIdleTimer, true);
        });

        // --- 繪圖與解鎖功能 ---
        function drawPattern() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (selectedNodes.length > 0) {
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#c5a059';
                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(197, 160, 89, 0.5)';
                const start = nodes.find(n => n.id === selectedNodes[0]);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < selectedNodes.length; i++) {
                    const node = nodes.find(n => n.id === selectedNodes[i]);
                    ctx.lineTo(node.x, node.y);
                }
                if (isDrawing) ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            nodes.forEach(node => {
                const active = selectedNodes.includes(node.id);
                ctx.beginPath();
                ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
                ctx.strokeStyle = active ? '#c5a059' : '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.stroke();
                if (active) {
                    ctx.beginPath(); ctx.arc(node.x, node.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#c5a059'; ctx.fill();
                    ctx.beginPath(); ctx.arc(node.x, node.y, nodeRadius + 5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(197, 160, 89, 0.1)'; ctx.fill();
                }
            });
            requestAnimationFrame(drawPattern);
        }

        function handleStart(e) { isDrawing = true; selectedNodes = []; updateMousePos(e); checkCollision(); }
        function handleMove(e) { if (!isDrawing) return; updateMousePos(e); checkCollision(); }
        function handleEnd() { if (!isDrawing) return; isDrawing = false; validatePattern(); }
        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mousePos = { x: clientX - rect.left, y: clientY - rect.top };
        }
        function checkCollision() {
            nodes.forEach(node => {
                const dist = Math.hypot(mousePos.x - node.x, mousePos.y - node.y);
                if (dist < hitRadius && !selectedNodes.includes(node.id)) {
                    selectedNodes.push(node.id);
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            });
        }
        function validatePattern() {
            const pattern = selectedNodes.join('');
            if (pattern === CORRECT_PATTERN) {
                unlockVault();
            } else if (selectedNodes.length > 0) {
                patternBox.classList.add('shake');
                document.getElementById('authStatusText').innerText = "圖形錯誤，請重新嘗試";
                document.getElementById('authStatusText').classList.replace('text-zinc-500', 'text-red-500');
                setTimeout(() => {
                    patternBox.classList.remove('shake');
                    selectedNodes = [];
                    document.getElementById('authStatusText').innerText = "請繪製解鎖圖形以進入存取檔案庫";
                    document.getElementById('authStatusText').classList.replace('text-red-500', 'text-zinc-500');
                }, 600);
            }
        }

        function unlockVault() {
            sessionStorage.setItem(SESSION_AUTH_FLAG, 'true');
            resetIdleTimer(); // 解鎖後啟動計時
            const auth = document.getElementById('authOverlay');
            auth.style.opacity = '0';
            auth.style.transform = 'scale(1.1)';
            auth.style.pointerEvents = 'none';
            setTimeout(() => {
                auth.style.display = 'none';
                document.getElementById('mainNav').style.visibility = 'visible';
                document.getElementById('appContent').style.visibility = 'visible';
                renderGallery();
            }, 800);
        }

        function showAppDirectly() {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainNav').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            resetIdleTimer();
            renderGallery();
        }

        function logout() {
            sessionStorage.removeItem(SESSION_AUTH_FLAG);
            location.reload();
        }

        // --- 畫布事件監聽 ---
        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { handleMove(e); }, {passive: false});
        window.addEventListener('touchend', handleEnd);
        drawPattern();

        // --- 應用程式邏輯 ---
        window.onload = function() {
            if (sessionStorage.getItem(SESSION_AUTH_FLAG) === 'true') showAppDirectly();
        };

        function renderGallery(showSkeleton = true) {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => {
                const matchSearch = i.name.toLowerCase().includes(query) || (i.code || "").toLowerCase().includes(query);
                const matchTags = selectedFilterTags.size === 0 || (i.tags || []).some(t => selectedFilterTags.has(t));
                return matchSearch && matchTags;
            });
            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
            if(currentPage > totalPages) currentPage = totalPages;
            const startIndex = (currentPage - 1) * pageSize;
            const paginatedItems = filtered.slice(startIndex, startIndex + pageSize);

            document.getElementById('navStat').innerText = `${totalItems} 筆`;
            document.getElementById('pageIndicator').innerText = `/  ${currentPage} / ${totalPages}頁 `;
            gallery.innerHTML = "";
            if(totalItems === 0) {
                gallery.className = "flex flex-col items-center justify-center col-span-full py-40 opacity-30";
                gallery.innerHTML = `<h3 class="serif-bold text-2xl uppercase text-white">沒有紀錄</h3>`;
                return;
            } else {
                gallery.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8";
            }
            paginatedItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "entry-card group fade-in";
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="aspect-video overflow-hidden border-b border-zinc-900 bg-black">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="serif-bold text-lg text-white truncate mb-1 group-hover:text-[#c5a059] transition-colors">${item.name}</h3>
                        <p class="text-[9px] text-zinc-600 font-bold tracking-widest uppercase">${item.code || "未歸檔序列"}</p>
                        <div class="mt-auto pt-8 flex gap-3">
                            <button type="button" onclick="openDrawer('${item.id}')" class="flex-1 py-3 text-[11px] font-bold bg-zinc-900/50 text-zinc-500 hover:text-white rounded-lg border border-zinc-900 transition-all">編輯</button>
                            ${item.url ? `<button type="button" onclick="window.open('${item.url}', '_blank')" class="flex-1 py-3 text-[11px] font-bold bg-zinc-900/50 text-[#c5a059] hover:bg-[#c5a059] hover:text-black rounded-lg border border-zinc-900 transition-all">連結</button>` : ''}
                        </div>
                    </div>`;
                gallery.appendChild(card);
            });
            renderPagination(totalPages);
            renderTags();
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if(totalPages <= 1) { container.innerHTML = ""; return; }
            let html = `<button type="button" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="page-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg></button>`;
            for(let i = 1; i <= totalPages; i++) {
                if(i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button type="button" onclick="changePage(${i})" class="page-btn ${i === currentPage ? 'active' : ''}">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span class="text-zinc-800 font-bold px-1">...</span>`;
                }
            }
            html += `<button type="button" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="page-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg></button>`;
            container.innerHTML = html;
        }

        function changePage(p) { currentPage = p; window.scrollTo({ top: 0, behavior: 'smooth' }); renderGallery(false); }

        function renderTags() {
            const tagCounts = {};
            collections.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
            const container = document.getElementById('filterTagsContainer');
            if(!container) return;
            container.innerHTML = "";
            Object.keys(tagCounts).sort((a,b) => tagCounts[b] - tagCounts[a]).forEach(tag => {
                const btn = document.createElement('button');
                const active = selectedFilterTags.has(tag);
                btn.type = "button";
                btn.className = `px-4 py-2 rounded-lg text-[10px] font-bold border transition-all ${active ? 'bg-[#c5a059] border-[#c5a059] text-black shadow-lg' : 'bg-black border-zinc-800 text-zinc-500 hover:border-zinc-700'}`;
                btn.innerHTML = `${tag} <span class="ml-1 opacity-50">${tagCounts[tag]}</span>`;
                btn.onclick = () => { if(selectedFilterTags.has(tag)) selectedFilterTags.delete(tag); else selectedFilterTags.add(tag); currentPage = 1; renderGallery(false); };
                container.appendChild(btn);
            });
        }

        function openDrawer(id = null) {
            currentId = id;
            document.getElementById('drawer').classList.add('open');
            document.getElementById('overlay').classList.replace('opacity-0', 'opacity-100');
            document.getElementById('overlay').classList.remove('pointer-events-none');
            
            if(id !== null) {
                const item = collections.find(i => String(i.id) === String(id));
                if (item) {
                    document.getElementById('nameInput').value = item.name || "";
                    document.getElementById('codeInput').value = item.code || "";
                    document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                    document.getElementById('imgInput').value = item.img || "";
                    document.getElementById('urlInput').value = item.url || "";
                    previewImage(item.img || "");
                    document.getElementById('drawerDeleteBtn').classList.remove('hidden');
                }
            } else {
                ['nameInput','codeInput','tagsInput','imgInput','urlInput'].forEach(k => document.getElementById(k).value = "");
                previewImage("");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            if(!document.getElementById('filterDrawer').classList.contains('open') && !document.getElementById('confirmModal').classList.contains('open')) {
                document.getElementById('overlay').classList.replace('opacity-100', 'opacity-0');
                document.getElementById('overlay').classList.add('pointer-events-none');
            }
        }
        
        function closeAllDrawers() { closeDrawer(); toggleFilterDrawer(false); closeConfirm(); }

        function toggleFilterDrawer(open) {
            const d = document.getElementById('filterDrawer');
            const o = document.getElementById('overlay');
            if(open) { d.classList.add('open'); o.classList.replace('opacity-0', 'opacity-100'); o.classList.remove('pointer-events-none'); }
            else { d.classList.remove('open'); if(!document.getElementById('drawer').classList.contains('open')) { o.classList.replace('opacity-100', 'opacity-0'); o.classList.add('pointer-events-none'); } }
        }

        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            
            if(!name) return showToast("名稱為必填項目");

            // --- 重複檢查 ---
            if (!currentId && code !== "") {
                const isDuplicate = collections.some(item => item.code === code);
                if (isDuplicate) {
                    document.getElementById('codeInput').classList.add('shake');
                    setTimeout(() => document.getElementById('codeInput').classList.remove('shake'), 500);
                    return showToast(`番號 ${code} 已存在`);
                }
            }

            const data = { 
                id: currentId || Date.now().toString(),
                name, 
                code: code, 
                tags: document.getElementById('tagsInput').value.split(/\s+/).filter(t => t), 
                img: document.getElementById('imgInput').value.trim(), 
                url: document.getElementById('urlInput').value.trim(), 
                updatedAt: Date.now() 
            };
            
            if(currentId) {
                const index = collections.findIndex(i => String(i.id) === String(currentId));
                if(index !== -1) collections[index] = data;
                else collections.unshift(data);
            }
            else collections.unshift(data);
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery(); closeDrawer(); showToast("紀錄已保存");
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(collections, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `檔案庫導出數據.json`; a.click(); showToast("數據導出完成");
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(Array.isArray(data)) { collections = data; localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); renderGallery(); showToast("數據同步完成"); }
                } catch(e) { showToast("同步失敗：數據損毀"); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 3000); }
        function previewImage(url) {
            const container = document.getElementById('editPreview');
            container.innerHTML = url ? `<img src="${url}" class="w-full h-full object-cover">` : `<span class="text-zinc-800 text-[10px] font-bold tracking-widest">暫無預覽圖</span>`;
        }
        function debouncedRender() { renderGallery(false); }
        function requestDelete() { document.getElementById('confirmModal').classList.add('open'); }
        function closeConfirm() { document.getElementById('confirmModal').classList.remove('open'); }
        
        function executeDelete() { 
            if(!currentId) return;
            collections = collections.filter(i => String(i.id) !== String(currentId)); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); 
            closeConfirm(); closeDrawer(); 
            renderGallery(); showToast("紀錄已永久抹除"); 
            currentId = null;
        }
    </script>
