<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NF MOBILE ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #141414;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --icon-size: 20px;
            --stroke-width: 2.5px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 120px 16px; box-sizing: border-box; }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
        }
        .brand-logo { color: var(--nf-red); font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #71717a; transition: color 0.2s; height: 100%;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; line-height: 1; }
        .nav-item svg { width: var(--icon-size); height: var(--icon-size); }

        /* Poster Card */
        .poster-card {
            position: relative; background: #111; border-radius: 8px; overflow: hidden;
            aspect-ratio: 16 / 9; width: 100%; margin-bottom: 8px;
            touch-action: pan-y;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
            pointer-events: none;
        }

        .card-play-btn {
            position: absolute; bottom: 12px; right: 12px;
            width: 38px; height: 38px;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 10; border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }
        .card-play-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

        /* Drawer */
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background-color: var(--nf-black); transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; overflow-y: auto; padding: 25px;
        }
        .drawer.open { transform: translateY(0); }

        .search-container {
            position: relative; margin-bottom: 1.5rem;
        }
        .search-icon {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            width: var(--icon-size); height: var(--icon-size); color: #71717a;
            pointer-events: none;
        }
        .search-input {
            width: 100%; background-color: #18181b; border: none; border-radius: 8px;
            padding: 0.85rem 1rem 0.85rem 3rem; font-size: 0.875rem; color: white;
            outline: none; transition: ring 0.2s;
        }
        .search-input:focus { ring: 1px solid #3f3f46; }

        #authOverlay {
            position: fixed; inset: 0; background-color: var(--nf-black);
            z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .actor-badge {
            background: #222; border-radius: 50%; width: 80px; height: 80px;
            margin: 0 auto 8px; border: 2px solid #333;
        }

        .tag-pill {
            background: #1a1a1a; color: #ccc; padding: 10px 18px; border-radius: 4px;
            font-size: 13px; font-weight: 500; border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo mb-10 tracking-widest">ARCHIVE</h1>
        <div id="patternBox"><canvas id="patternCanvas" width="300" height="300"></canvas></div>
        <p class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">請繪製圖形解鎖</p>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="brand-logo">Archive</div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            <!-- 首頁 -->
            <div id="page1" class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded tracking-tighter">0 ITEMS</span>
                </div>
                
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋影片、番號或演員..." class="search-input">
                </div>

                <div id="gallery" class="grid grid-cols-1 gap-4"></div>
                <div id="paginationContainer" class="mt-12 flex justify-center gap-2"></div>
            </div>

            <!-- 標籤頁 -->
            <div id="page2" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">影片標籤</h2>
                <div id="tagCloud" class="flex flex-wrap gap-3 px-2"></div>
            </div>
            
            <!-- 演員頁 -->
            <div id="page3" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">所有演員</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-10 gap-x-2 text-center"></div>
            </div>
        </div>
    </div>

    <!-- 底部導航 -->
    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" id="navHome" onclick="switchTab(0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首頁</span>
        </div>
        <div class="nav-item" id="navTags" onclick="switchTab(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path><path d="M7 7h.01"></path>
            </svg>
            <span>標籤</span>
        </div>
        <div class="nav-item" id="navActor" onclick="switchTab(2)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>演員</span>
        </div>
        <div class="nav-item" onclick="openDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>新增</span>
        </div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.17a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>設定</span>
        </div>
    </nav>

    <!-- Drawer 結構 -->
    <div id="drawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">影片資訊</h3>
            <button onclick="closeDrawer()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="watchButtonArea" class="mb-8 hidden">
             <button id="externalLinkBtn" onclick="goToLink()" class="w-full bg-white text-black py-4 rounded-lg font-black flex items-center justify-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>立即觀看
             </button>
        </div>
        <div class="space-y-6">
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2">名稱 / 演員</label><input type="text" id="nameInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2">番號</label><input type="text" id="codeInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2">連結 (URL)</label><input type="text" id="urlInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2">標籤</label><input type="text" id="tagsInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2">海報連結</label><input type="text" id="imgInput" oninput="previewImage(this.value)" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div id="editPreview" class="aspect-[16/9] w-full bg-zinc-900 rounded flex items-center justify-center text-[10px] text-zinc-700">PREVIEW</div>
            <div class="pt-10 space-y-4">
                <button onclick="saveItem()" class="w-full bg-red-600 py-4 font-bold rounded-lg shadow-lg">儲存內容</button>
                <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full py-2 text-zinc-600 text-xs font-bold hidden">刪除此項目</button>
            </div>
        </div>
    </div>

    <!-- Filter Drawer -->
    <div id="filterDrawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">帳戶設定</h3>
            <button onclick="toggleFilterDrawer(false)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="space-y-4">
            <button onclick="exportData()" class="w-full py-4 bg-zinc-900 rounded font-bold">匯出備份 (JSON)</button>
            <label class="block w-full py-4 bg-zinc-900 rounded font-bold text-center cursor-pointer">
                匯入備份 <input type="file" class="hidden" accept=".json" onchange="importData(event)">
            </label>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-8">
        <div class="text-center">
            <h4 class="text-xl font-bold mb-8">確定要刪除嗎？</h4>
            <div class="flex flex-col gap-4">
                <button onclick="executeDelete()" class="w-64 bg-red-600 py-4 font-bold rounded-lg">刪除</button>
                <button onclick="closeConfirm()" class="py-2 text-zinc-500">取消</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 transition-all pointer-events-none"></div>

    <script>
        const CORRECT_PATTERN = "0124678";
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null, currentPage = 1, pageSize = 12, pressTimer;
        let isDrawing = false, selectedNodes = [], mousePos = { x: 0, y: 0 };
        const nodes = [];

        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                nodes.push({ id: (i * 3 + j).toString(), x: 50 + j * 100, y: 50 + i * 100 });
            }
        }

        function switchTab(index) {
            const container = document.getElementById('pageContainer');
            container.style.transform = `translateX(-${index * (100/3)}%)`;
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach((el, i) => el.classList.toggle('active', i === index));
            if(index === 1) renderTagCloud();
            if(index === 2) renderActorList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handlePressStart(id) {
            pressTimer = setTimeout(() => {
                window.navigator.vibrate?.(40);
                openDrawer(id);
            }, 600);
        }
        function handlePressEnd() { clearTimeout(pressTimer); }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => {
                return i.name.toLowerCase().includes(query) || (i.code || "").toLowerCase().includes(query) || (i.tags || []).some(t => t.toLowerCase().includes(query));
            });
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            const total = Math.ceil(filtered.length / pageSize);
            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card" ontouchstart="handlePressStart('${item.id}')" ontouchend="handlePressEnd()" onmousedown="handlePressStart('${item.id}')" onmouseup="handlePressEnd()">
                    <img src="${item.img || 'https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=640'}" loading="lazy">
                    ${item.url ? `<div class="card-play-btn" onclick="openExternalUrl('${item.url}', event)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : ''}
                    <div class="card-overlay">
                        <p class="text-[9px] font-black text-red-600 mb-0.5 tracking-wider">${item.code || 'SERIES'}</p>
                        <p class="text-[13px] font-bold truncate pr-12">${item.name}</p>
                    </div>
                </div>
            `).join('');
            renderPagination(total);
        }

        function openExternalUrl(url, e) { if(e) e.stopPropagation(); window.open(url.startsWith('http') ? url : 'https://' + url, '_blank'); }

        function renderTagCloud() {
            const container = document.getElementById('tagCloud');
            const map = {}; collections.forEach(i => (i.tags || []).forEach(tag => map[tag] = (map[tag] || 0) + 1));
            const sortedTags = Object.entries(map).sort((a,b) => b[1] - a[1]);
            container.innerHTML = sortedTags.map(([tag, count]) => `<div onclick="filterBySearch('${tag}')" class="tag-pill">${tag} <span class="ml-1 text-[10px] opacity-40">${count}</span></div>`).join('');
        }

        function renderActorList() {
            const list = document.getElementById('actorList');
            const map = {};
            collections.forEach(i => {
                const names = i.name.split(/[\s,，]+/).filter(n => n.trim());
                names.forEach(n => map[n] = (map[n] || 0) + 1);
            });
            const sorted = Object.entries(map).sort((a,b) => b[1] - a[1]);
            list.innerHTML = sorted.map(([name, count]) => `
                <div onclick="filterBySearch('${name}')">
                    <div class="actor-badge overflow-hidden flex items-center justify-center">
                        <img src="https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=141414" class="w-full h-full">
                    </div>
                    <span class="text-xs font-bold">${name}</span>
                    <span class="block text-[9px] text-zinc-600 mt-0.5">${count} 作品</span>
                </div>
            `).join('');
        }

        function filterBySearch(val) { document.getElementById('searchInput').value = val; switchTab(0); renderGallery(); }

        function drawPattern() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (selectedNodes.length > 0) {
                ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = '#E50914';
                const start = nodes.find(n => n.id === selectedNodes[0]);
                ctx.moveTo(start.x, start.y);
                selectedNodes.forEach(id => { const node = nodes.find(n => n.id === id); ctx.lineTo(node.x, node.y); });
                if (isDrawing) ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
            }
            nodes.forEach(node => {
                const active = selectedNodes.includes(node.id);
                ctx.beginPath(); ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = active ? '#E50914' : '#333'; ctx.fill();
            });
            requestAnimationFrame(drawPattern);
        }

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; selectedNodes = []; });
        window.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mousePos = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
            nodes.forEach(node => { if (Math.hypot(mousePos.x - node.x, mousePos.y - node.y) < 25 && !selectedNodes.includes(node.id)) selectedNodes.push(node.id); });
        });
        window.addEventListener('touchend', () => {
            if (!isDrawing) return; isDrawing = false;
            if (selectedNodes.join('') === CORRECT_PATTERN) unlockVault();
            else selectedNodes = [];
        });
        drawPattern();

        function unlockVault() {
            sessionStorage.setItem('VAULT_UNLOCKED', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            document.getElementById('bottomNav').style.visibility = 'visible';
            renderGallery();
        }

        function openDrawer(id = null) {
            currentId = id; document.getElementById('drawer').classList.add('open');
            const watchArea = document.getElementById('watchButtonArea');
            if(id) {
                const item = collections.find(i => String(i.id) === String(id));
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
                watchArea.classList.toggle('hidden', !item.url);
                previewImage(item.img);
            } else {
                ['nameInput','codeInput','urlInput','tagsInput','imgInput'].forEach(k => document.getElementById(k).value = "");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
                watchArea.classList.add('hidden');
                previewImage("");
            }
        }

        function goToLink() { 
            const item = collections.find(i => String(i.id) === String(currentId));
            if(item?.url) openExternalUrl(item.url);
        }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
        function toggleFilterDrawer(open) { document.getElementById('filterDrawer').classList.toggle('open', open); }
        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            if(!name) return;
            const data = { id: currentId || Date.now().toString(), name, code: document.getElementById('codeInput').value.trim().toUpperCase(), url: document.getElementById('urlInput').value.trim(), tags: document.getElementById('tagsInput').value.trim().split(/\s+/).filter(t => t), img: document.getElementById('imgInput').value.trim() };
            if(currentId) collections[collections.findIndex(i => String(i.id) === String(currentId))] = data;
            else collections.unshift(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery(); closeDrawer(); showToast("已儲存");
        }
        function executeDelete() { collections = collections.filter(i => String(i.id) !== String(currentId)); localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); closeConfirm(); closeDrawer(); renderGallery(); showToast("已刪除"); }
        function requestDelete() { document.getElementById('confirmModal').classList.remove('hidden'); }
        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if(total <= 1) { container.innerHTML = ""; return; }
            let html = "";
            for(let i = 1; i <= total; i++) html += `<button onclick="changePage(${i})" class="w-8 h-8 rounded-full text-[10px] font-bold ${i === currentPage ? 'bg-red-600' : 'bg-zinc-900 text-zinc-500'}">${i}</button>`;
            container.innerHTML = html;
        }
        function changePage(p) { currentPage = p; window.scrollTo({top:0, behavior:'smooth'}); renderGallery(); }
        function previewImage(url) { document.getElementById('editPreview').innerHTML = url ? `<img src="${url}" class="w-full h-full object-cover rounded">` : "PREVIEW"; }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = "1"; t.style.transform = "translate(-50%, -10px)";
            setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translate(-50%, 0)"; }, 2000);
        }
        function exportData() {
            const blob = new Blob([JSON.stringify(collections)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'archive.json'; a.click();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                collections = JSON.parse(ev.target.result);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
                renderGallery(); showToast("匯入成功");
            };
            reader.readAsText(e.target.files[0]);
        }
        function debouncedRender() { clearTimeout(window.timer); window.timer = setTimeout(renderGallery, 300); }
        window.onload = () => { if(sessionStorage.getItem('VAULT_UNLOCKED') === 'true') unlockVault(); };
    </script>
</body>
</html>
