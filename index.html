<!-- 替換原有的 script 內容或更新相關 function -->
<script>
    // 1. 新增防抖函數 (Debounce)
    function debounce(func, delay = 300) {
        let timer;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => func.apply(this, args), delay);
        };
    }

    // 2. 強化搜尋邏輯 (處理橫槓、權重、大小寫)
    function getFilteredItems() {
        const rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
        
        // 正規化：移除所有非字母數字的字元，方便番號比對 (例如 SNIS-001 -> snis001)
        const normalizedQuery = rawQuery.replace(/[^a-z0-9]/g, '');

        return collections.filter(item => {
            if (!rawQuery && selectedFilterTags.size === 0) return true;

            // 標籤篩選 (必須符合所有選中的標籤)
            const matchesTags = selectedFilterTags.size === 0 || 
                               Array.from(selectedFilterTags).every(t => (item.tags || []).includes(t));
            
            if (!matchesTags) return false;
            if (!rawQuery) return true;

            // 名稱比對
            const nameMatch = item.name.toLowerCase().includes(rawQuery);
            
            // 番號比對 (包含原始比對與正規化比對)
            const itemCode = (item.code || "").toLowerCase();
            const normalizedCode = itemCode.replace(/[^a-z0-9]/g, '');
            const codeMatch = itemCode.includes(rawQuery) || (normalizedQuery && normalizedCode.includes(normalizedQuery));

            // 標籤模糊比對 (選填)
            const tagsMatch = (item.tags || []).some(t => t.toLowerCase().includes(rawQuery));

            return nameMatch || codeMatch || tagsMatch;
        });
    }

    // 3. 更新渲染函數，加入搜尋結果提示
    function renderGallery(showSkeleton = true) {
        const gallery = document.getElementById('gallery');
        const filtered = getFilteredItems();
        
        const totalItems = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
        
        if(currentPage > totalPages) currentPage = totalPages;
        const startIndex = (currentPage - 1) * pageSize;
        const paginatedItems = filtered.slice(startIndex, startIndex + pageSize);

        // 更新導覽列統計
        document.getElementById('navStat').innerText = `找到 ${totalItems} 筆`;
        document.getElementById('pageIndicator').innerText = `/  ${currentPage} / ${totalPages}頁 `;

        gallery.innerHTML = "";

        if(totalItems === 0) {
            renderEmptyState();
            return;
        }

        gallery.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8";
        
        paginatedItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "entry-card group fade-in";
            card.style.animationDelay = `${index * 0.03}s`; // 加快動畫速度
            card.innerHTML = `
                <div class="aspect-video overflow-hidden border-b border-zinc-900 bg-black">
                    <img src="${item.img || 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'}" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" 
                         loading="lazy"
                         onerror="this.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800'">
                </div>
                <div class="p-5 flex flex-col flex-grow">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="serif-bold text-lg text-white truncate group-hover:text-[#c5a059] transition-colors">${item.name}</h3>
                    </div>
                    <p class="text-[9px] text-[#c5a059] font-bold tracking-widest uppercase mb-4">${item.code || "N/A"}</p>
                    
                    <!-- 顯示標籤預覽 -->
                    <div class="flex flex-wrap gap-1 mb-6">
                        ${(item.tags || []).slice(0, 3).map(t => `<span class="text-[8px] bg-zinc-900 px-1.5 py-0.5 rounded text-zinc-500">#${t}</span>`).join('')}
                    </div>

                    <div class="mt-auto flex gap-3">
                        <button type="button" onclick="openDrawer('${item.id}')" class="flex-1 py-2.5 text-[10px] font-bold bg-zinc-900/50 text-zinc-500 hover:text-white rounded-lg border border-zinc-900 transition-all">EDIT</button>
                        ${item.url ? `<button type="button" onclick="window.open('${item.url}', '_blank')" class="flex-1 py-2.5 text-[10px] font-bold bg-[#c5a059]/10 text-[#c5a059] hover:bg-[#c5a059] hover:text-black rounded-lg border border-[#c5a059]/20 transition-all">LINK</button>` : ''}
                    </div>
                </div>`;
            gallery.appendChild(card);
        });
        
        renderPagination(totalPages);
        renderTags();
    }

    // 當搜尋結果為空時的 UI
    function renderEmptyState() {
        const gallery = document.getElementById('gallery');
        gallery.className = "flex flex-col items-center justify-center col-span-full py-40";
        gallery.innerHTML = `
            <div class="text-zinc-800 mb-4">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <h3 class="serif-bold text-xl uppercase text-zinc-500 tracking-widest">未尋獲匹配檔案</h3>
            <button onclick="clearFilters()" class="mt-6 text-[10px] text-[#c5a059] border border-[#c5a059]/30 px-6 py-2 rounded-full hover:bg-[#c5a059] hover:text-black transition-all font-bold">清除所有篩選</button>
        `;
        document.getElementById('paginationContainer').innerHTML = "";
    }

    function clearFilters() {
        document.getElementById('searchInput').value = "";
        selectedFilterTags.clear();
        currentPage = 1;
        renderGallery();
    }

    // 將 debouncedRender 定義為防抖版本
    const debouncedRender = debounce(() => {
        currentPage = 1; // 搜尋時回到第一頁
        renderGallery(false);
    }, 400);

</script>
