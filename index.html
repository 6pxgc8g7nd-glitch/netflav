<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>netflav - Modular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow: hidden; /* 防止解鎖前滾動 */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 頁面切換容器 */
        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { 
            display: flex; 
            width: 300%; 
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); 
            min-height: 100vh;
        }
        .page-content { 
            width: 33.3333%; 
            padding: calc(var(--nav-height) + 20px) 16px 140px 16px; 
            box-sizing: border-box;
            height: 100vh;
            overflow-y: auto; /* 每個頁面獨立滾動 */
        }

        /* 頂部與底部導航 */
        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #71717a; transition: color 0.2s; height: 100%;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 4px; }

        /* 元件樣式 */
        .poster-card { position: relative; background: #111; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 8px; }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; pointer-events: none; }
        .tag-pill { background: #1a1a1b; padding: 8px 16px; border-radius: 12px; font-size: 13px; border: 1px solid #27272a; display: flex; gap: 8px; cursor: pointer; }
        .actor-badge { background: #1a1a1a; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border: 1px solid #2a2a2a; }

        /* 跳轉樣式 */
        .jump-box { display: flex; align-items: center; background: #151518; border-radius: 20px; padding: 0 10px; height: 30px; border: 1px solid #27272a; margin-top: 10px; }
        .jump-input { background: transparent; width: 30px; text-align: center; color: var(--nf-red); font-weight: 900; border: none; outline: none; font-size: 12px; }

        #authOverlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .drawer { position: fixed; inset: 0; background: #000; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; padding: 25px; overflow-y: auto; }
        .drawer.open { transform: translateY(0); }
        .status-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px currentColor; }
        .led-active { color: #22c55e; background-color: #22c55e; }
        .led-paused { color: #ef4444; background-color: #ef4444; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo text-3xl font-black text-red-600 mb-10 tracking-tighter">NETFLAV</h1>
        <canvas id="patternCanvas" width="300" height="300"></canvas>
        <p class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">繪製圖形以解鎖</p>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="brand-logo text-xl font-black text-red-600" onclick="PageManager.switchTo(0)">NETFLAV</div>
        <div class="absolute right-5" onclick="System.toggleAutoLogout()">
            <span id="statusLed" class="status-led led-active"></span>
        </div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            
            <section id="page_home" class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded">0 ITEMS</span>
                </div>
                <div class="relative mb-6">
                    <input type="text" id="searchInput" oninput="Gallery.debouncedRender()" placeholder="搜尋影片、番號..." class="w-full bg-zinc-900 rounded-lg py-3 px-10 text-sm outline-none">
                    <div class="absolute left-3 top-3.5 text-zinc-500">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </div>
                </div>
                <div id="gallery" class="grid gap-4"></div>
                <div id="paginationContainer" class="flex flex-col items-center mt-8 pb-10"></div>
            </section>

            <section id="page_tags" class="page-content">
                <h2 class="text-2xl font-bold mb-8">影片標籤</h2>
                <div id="tagCloud" class="flex flex-wrap gap-3"></div>
            </section>

            <section id="page_actors" class="page-content">
                <h2 class="text-2xl font-bold mb-8">所有演員</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-8 gap-x-2"></div>
            </section>

        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" onclick="PageManager.switchTo(0)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>首頁</span>
        </div>
        <div class="nav-item" onclick="PageManager.switchTo(1)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
            <span>標籤</span>
        </div>
        <div class="nav-item" onclick="PageManager.switchTo(2)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>演員</span>
        </div>
        <div class="nav-item" onclick="System.openDrawer()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>新增</span>
        </div>
        <div class="nav-item" onclick="System.toggleSettings(true)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>設定</span>
        </div>
    </nav>

    <div id="drawer" class="drawer">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">編輯影片</h3>
            <button onclick="System.closeDrawer()">關閉</button>
        </div>
        <div class="space-y-5">
            <input type="text" id="nameInput" placeholder="名稱" class="w-full bg-zinc-900 p-4 rounded-lg">
            <input type="text" id="codeInput" placeholder="番號" class="w-full bg-zinc-900 p-4 rounded-lg">
            <input type="text" id="urlInput" placeholder="連結" class="w-full bg-zinc-900 p-4 rounded-lg">
            <input type="text" id="tagsInput" placeholder="標籤 (空白分隔)" class="w-full bg-zinc-900 p-4 rounded-lg">
            <input type="text" id="imgInput" placeholder="封面圖片網址" class="w-full bg-zinc-900 p-4 rounded-lg">
            <button onclick="Gallery.saveItem()" class="w-full bg-red-600 py-4 rounded-lg font-bold">儲存</button>
        </div>
    </div>

    <script>
        // --- 核心資料 ---
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        // --- 1. 頁面管理模組 ---
        const PageManager = {
            current: 0,
            switchTo(index) {
                this.current = index;
                const container = document.getElementById('pageContainer');
                container.style.transform = `translateX(-${index * (100/3)}%)`;
                
                // 更新導航樣式
                document.querySelectorAll('.nav-item').forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });

                // 根據頁面執行渲染
                if (index === 0) Gallery.render();
                if (index === 1) Tags.render();
                if (index === 2) Actors.render();
                
                window.scrollTo(0, 0);
            }
        };

        // --- 2. 首頁/列表模組 ---
        const Gallery = {
            page: 1,
            size: 12,
            render() {
                const container = document.getElementById('gallery');
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const filtered = collections.filter(i => 
                    i.name.toLowerCase().includes(query) || 
                    (i.code || "").toLowerCase().includes(query) ||
                    (i.tags || []).some(t => t.toLowerCase().includes(query))
                );

                document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
                const paginated = filtered.slice((this.page - 1) * this.size, this.page * this.size);
                
                container.innerHTML = paginated.map(item => `
                    <div class="poster-card" onclick="System.openExternal('${item.url}')">
                        <img src="${item.img || 'https://via.placeholder.com/640x360/111/333?text=NO+IMAGE'}" loading="lazy">
                        <div class="card-overlay">
                            <p class="text-[9px] font-black text-red-600 uppercase">${item.code || 'SERIES'}</p>
                            <p class="text-[13px] font-bold truncate">${item.name}</p>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/50 p-2 rounded-full" onclick="event.stopPropagation(); System.editItem('${item.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </div>
                    </div>
                `).join('');
                this.renderPagination(Math.ceil(filtered.length / this.size));
            },
            renderPagination(total) {
                const container = document.getElementById('paginationContainer');
                if (total <= 1) { container.innerHTML = ""; return; }
                container.innerHTML = `
                    <div class="flex gap-2">
                        ${this.page > 1 ? `<button onclick="Gallery.setPage(${this.page-1})" class="px-4 py-2 bg-zinc-900 rounded">Prev</button>` : ''}
                        <div class="jump-box">
                            <input type="number" class="jump-input" value="${this.page}" onkeydown="if(event.key==='Enter') Gallery.setPage(this.value)">
                            <span class="text-xs text-zinc-500 mr-2">/ ${total}</span>
                        </div>
                        ${this.page < total ? `<button onclick="Gallery.setPage(${this.page+1})" class="px-4 py-2 bg-zinc-900 rounded">Next</button>` : ''}
                    </div>
                `;
            },
            setPage(p) { this.page = parseInt(p); this.render(); },
            debouncedRender() { clearTimeout(this.timer); this.timer = setTimeout(() => this.render(), 300); },
            saveItem() {
                // ... 儲存邏輯 (同前)
            }
        };

        // --- 3. 標籤模組 ---
        const Tags = {
            render() {
                const container = document.getElementById('tagCloud');
                const map = {};
                collections.forEach(i => (i.tags || []).forEach(t => map[t] = (map[t] || 0) + 1));
                container.innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([tag, count]) => `
                    <div class="tag-pill" onclick="System.quickSearch('${tag}')">
                        <span>${tag}</span>
                        <span class="text-zinc-500 text-[10px]">${count}</span>
                    </div>
                `).join('');
            }
        };

        // --- 4. 演員模組 ---
        const Actors = {
            render() {
                const container = document.getElementById('actorList');
                const map = {};
                collections.forEach(i => {
                    const names = i.name.split(/[\s,，、/]+/).filter(n => n.length > 1);
                    names.forEach(n => map[n] = (map[n] || 0) + 1);
                });
                container.innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name, count]) => `
                    <div class="flex flex-col items-center" onclick="System.quickSearch('${name}')">
                        <div class="actor-badge text-xl font-black text-zinc-600">${name[0]}</div>
                        <span class="text-xs mt-2 font-bold">${name}</span>
                        <span class="text-[9px] text-zinc-500">${count} 作品</span>
                    </div>
                `).join('');
            }
        };

        // --- 5. 系統功能 (解鎖、彈窗、自動登出) ---
        const System = {
            unlock() {
                sessionStorage.setItem('VAULT_UNLOCKED', 'true');
                document.getElementById('authOverlay').style.display = 'none';
                document.body.style.overflow = 'auto';
                document.getElementById('mainHeader').style.visibility = 'visible';
                document.getElementById('appContent').style.visibility = 'visible';
                document.getElementById('bottomNav').style.visibility = 'visible';
                Gallery.render();
            },
            quickSearch(val) {
                document.getElementById('searchInput').value = val;
                PageManager.switchTo(0);
            },
            openExternal(url) { if(url) window.open(url.startsWith('http')?url:'https://'+url, '_blank'); },
            openDrawer() { document.getElementById('drawer').classList.add('open'); },
            closeDrawer() { document.getElementById('drawer').classList.remove('open'); },
            toggleSettings(show) { /* 設定邏輯 */ alert('設定暫未實作'); }
        };

        // --- 初始化解鎖圖形 (簡化版邏輯) ---
        const canvas = document.getElementById('patternCanvas');
        canvas.addEventListener('click', () => System.unlock()); // 這裡暫時點擊即解鎖以便調試

        window.onload = () => {
            if(sessionStorage.getItem('VAULT_UNLOCKED') === 'true') System.unlock();
        };
    </script>
</body>
</html>
