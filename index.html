<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Netflav - Vault Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #121212;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* --- 基礎設定 --- */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- 演員列表：簡約扁平化 --- */
        .actor-badge { 
            background: #1a1a1a; 
            border-radius: 50%; 
            width: 76px; height: 76px; 
            margin: 0 auto 8px; 
            border: 1px solid #333; /* 移除霓虹，改為簡約深色邊框 */
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease;
            position: relative;
        }

        .actor-badge:active { transform: scale(0.95); background: #222; }

        .actor-initials {
            font-size: 24px;
            font-weight: 700;
            color: #ddd;
        }

        .actor-count-tag {
            background: #111;
            color: #71717a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 4px;
            border: 1px solid #222;
        }

        /* --- 頁面切換系統 --- */
        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; }

        /* --- 導航與標頭 --- */
        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); padding: 0 20px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #555; transition: color 0.2s;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; margin-top: 4px; font-weight: 600; }

        /* --- 卡片設計 --- */
        .poster-card {
            position: relative; background: #111; border-radius: 6px; overflow: hidden;
            aspect-ratio: 16 / 9; width: 100%;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
            pointer-events: none;
        }

        .action-circle-btn {
            position: absolute; width: 34px; height: 34px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 50; border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; cursor: pointer;
        }

        /* --- 動效與狀態 --- */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s ease-in-out; }

        .status-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transition: background 0.3s; }
        .led-active { background-color: #22c55e; }
        .led-paused { background-color: #ef4444; }

        .drawer {
            position: fixed; inset: 0; background: var(--nf-black);
            transform: translateY(100%); transition: transform 0.4s ease;
            z-index: 2000; overflow-y: auto; padding: 25px;
        }
        .drawer.open { transform: translateY(0); }

        /* --- 密碼鎖繪圖 --- */
        #patternCanvas { touch-action: none; }
    </style>
</head>
<body class="overflow-hidden">

    <div id="authOverlay" class="fixed inset-0 bg-black z-[5000] flex flex-col items-center justify-center">
        <h1 class="text-red-600 text-3xl font-black tracking-tighter mb-12">NETFLAV</h1>
        <div id="patternContainer">
            <canvas id="patternCanvas" width="300" height="300"></canvas>
        </div>
        <p class="text-zinc-600 text-[10px] tracking-[0.4em] mt-8 uppercase">繪製解鎖圖形</p>
    </div>

    <header class="mobile-header invisible" id="mainHeader">
        <div class="flex justify-between items-center w-full">
            <div class="text-red-600 text-xl font-black" onclick="refreshAndHome()">NETFLAV</div>
            <div onclick="toggleAutoLogout()" class="p-2">
                <span id="statusLed" class="status-led led-active"></span>
            </div>
        </div>
    </header>

    <div id="appContent" class="page-overflow-wrapper invisible">
        <div class="page-container" id="pageContainer">
            <div id="page1" class="page-content">
                <div class="flex justify-between items-baseline mb-6">
                    <h2 class="text-xl font-bold">推薦影片</h2>
                    <span id="itemCount" class="text-[9px] text-zinc-500 font-bold">0 ITEMS</span>
                </div>
                
                <div class="relative mb-6">
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋..." 
                           class="w-full bg-zinc-900 border-none rounded-lg py-3 px-10 text-sm text-white outline-none focus:ring-1 focus:ring-zinc-700">
                    <svg class="absolute left-3 top-3.5 text-zinc-500" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>

                <div id="gallery" class="grid gap-4"></div>
                <div id="paginationContainer" class="flex flex-col items-center gap-4 mt-10"></div>
            </div>

            <div id="page2" class="page-content">
                <h2 class="text-2xl font-bold mb-8">探索標籤</h2>
                <div id="tagCloud" class="flex flex-wrap gap-2"></div>
            </div>
            
            <div id="page3" class="page-content">
                <h2 class="text-2xl font-bold mb-8">所有演員</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-8 gap-x-2"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav invisible" id="bottomNav">
        <div class="nav-item active" onclick="switchTab(0)">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>首頁</span>
        </div>
        <div class="nav-item" onclick="switchTab(1)">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path></svg>
            <span>標籤</span>
        </div>
        <div class="nav-item" onclick="switchTab(2)">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>演員</span>
        </div>
        <div class="nav-item" onclick="openDrawer()">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>新增</span>
        </div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>設定</span>
        </div>
    </nav>

    <div id="drawer" class="drawer">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">編輯影片</h3>
            <button onclick="closeDrawer()" class="p-2"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="space-y-5">
            <input type="text" id="nameInput" placeholder="名稱 / 演員" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            <input type="text" id="codeInput" placeholder="番號" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            <input type="text" id="urlInput" placeholder="URL" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            <input type="text" id="tagsInput" placeholder="標籤 (空白分隔)" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            <input type="text" id="imgInput" placeholder="封面圖片網址" class="w-full bg-zinc-900 p-4 rounded-lg outline-none">
            <button onclick="saveItem()" class="w-full bg-red-600 py-4 font-black rounded-lg mt-4">儲存內容</button>
            <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full text-zinc-600 text-xs py-2 hidden">刪除此項目</button>
        </div>
    </div>

    <div id="filterDrawer" class="drawer">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">帳戶設定</h3>
            <button onclick="toggleFilterDrawer(false)"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="space-y-4">
            <div class="bg-zinc-900 p-4 rounded-lg">
                <p class="text-[10px] text-zinc-500 font-bold mb-3 tracking-widest uppercase">佈局</p>
                <div class="flex gap-2">
                    <button id="layoutBtn1" onclick="updateLayout(1)" class="flex-1 py-3 rounded text-xs font-bold">單欄</button>
                    <button id="layoutBtn2" onclick="updateLayout(2)" class="flex-1 py-3 rounded text-xs font-bold">雙欄</button>
                </div>
            </div>
            <button onclick="exportData()" class="w-full py-4 bg-zinc-900 rounded font-bold">備份數據 (Export)</button>
            <label class="block w-full py-4 bg-zinc-900 rounded font-bold text-center">
                導入數據 (Import) <input type="file" class="hidden" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="lockApp()" class="w-full py-4 text-red-600 font-bold">立即登出</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-8 text-center">
        <div>
            <h4 class="text-xl font-bold mb-8">確定刪除此內容？</h4>
            <button onclick="executeDelete()" class="w-64 bg-red-600 py-4 font-bold rounded-lg mb-4">確認刪除</button>
            <button onclick="closeConfirm()" class="block w-full text-zinc-500">取消</button>
        </div>
    </div>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 pointer-events-none transition-all"></div>

    <script>
        const STORAGE_KEY = 'NF_MOBILE_VAULT_MINIMAL';
        const CORRECT_PATTERN = "0124678";
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null, currentPage = 1, pageSize = 12;
        let isDrawing = false, selectedNodes = [], isErrorState = false;
        let currentLayout = parseInt(localStorage.getItem('NF_LAYOUT')) || 1;
        let logoutTimer = null, isAutoLogoutPaused = false;

        const nodes = [];
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');

        // --- 密碼鎖邏輯 ---
        function initPattern() {
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    nodes.push({ id: (i * 3 + j).toString(), x: 50 + j * 100, y: 50 + i * 100 });
                }
            }
            drawPattern();
        }

        function drawPattern() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 畫線
            if (selectedNodes.length > 0) {
                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.strokeStyle = isErrorState ? '#ff0000' : '#E50914';
                const start = nodes.find(n => n.id === selectedNodes[0]);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < selectedNodes.length; i++) {
                    const n = nodes.find(node => node.id === selectedNodes[i]);
                    ctx.lineTo(n.x, n.y);
                }
                ctx.stroke();
            }
            // 畫點
            nodes.forEach(node => {
                const active = selectedNodes.includes(node.id);
                ctx.beginPath();
                ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = active ? (isErrorState ? '#ff0000' : '#E50914') : '#333';
                ctx.fill();
            });
            requestAnimationFrame(drawPattern);
        }

        const handleStart = (e) => { e.preventDefault(); isDrawing = true; selectedNodes = []; isErrorState = false; };
        const handleMove = (e) => {
            if (!isDrawing || isErrorState) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            nodes.forEach(node => {
                if (Math.hypot(x - node.x, y - node.y) < 25 && !selectedNodes.includes(node.id)) {
                    selectedNodes.push(node.id);
                    if (window.navigator.vibrate) window.navigator.vibrate(5);
                }
            });
        };
        const handleEnd = () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (selectedNodes.join('') === CORRECT_PATTERN) {
                unlockVault();
            } else if (selectedNodes.length > 0) {
                isErrorState = true;
                document.getElementById('patternContainer').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('patternContainer').classList.remove('shake');
                    selectedNodes = [];
                    isErrorState = false;
                }, 500);
            }
        };

        canvas.addEventListener('touchstart', handleStart); canvas.addEventListener('touchmove', handleMove); canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);

        // --- 核心 App 邏輯 ---
        function unlockVault() {
            sessionStorage.setItem('LOCKED', 'false');
            document.getElementById('authOverlay').style.display = 'none';
            document.body.classList.remove('overflow-hidden');
            document.getElementById('mainHeader').classList.remove('invisible');
            document.getElementById('appContent').classList.remove('invisible');
            document.getElementById('bottomNav').classList.remove('invisible');
            updateLayout(currentLayout);
            resetLogoutTimer();
        }

        function lockApp() {
            sessionStorage.removeItem('LOCKED');
            location.reload();
        }

        function resetLogoutTimer() {
            if (isAutoLogoutPaused) return;
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => { lockApp(); }, 300000); // 5分鐘閒置
        }

        function toggleAutoLogout() {
            isAutoLogoutPaused = !isAutoLogoutPaused;
            const led = document.getElementById('statusLed');
            led.className = isAutoLogoutPaused ? "status-led led-paused" : "status-led led-active";
            showToast(isAutoLogoutPaused ? "自動登出已暫停" : "自動登出已啟用");
        }

        function switchTab(idx) {
            document.getElementById('pageContainer').style.transform = `translateX(-${idx * 33.3333}%)`;
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === idx));
            if (idx === 1) renderTagCloud();
            if (idx === 2) renderActorList();
            window.scrollTo(0, 0);
        }

        // --- 渲染功能 ---
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => i.name.toLowerCase().includes(q) || (i.code || "").toLowerCase().includes(q));
            
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            gallery.className = `grid gap-4 ${currentLayout === 2 ? 'grid-cols-2' : 'grid-cols-1'}`;
            
            const start = (currentPage - 1) * pageSize;
            const paginated = filtered.slice(start, start + pageSize);
            
            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card">
                    <img src="${item.img || 'https://via.placeholder.com/400x225/111/333?text=No+Image'}" loading="lazy">
                    <div class="action-circle-btn top-2 right-2" onclick="openDrawer('${item.id}')">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </div>
                    ${item.url ? `<div class="action-circle-btn bottom-2 right-2" onclick="window.open('${item.url}')"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : ''}
                    <div class="card-overlay">
                        <p class="text-[9px] font-black text-red-600 tracking-wider">${item.code || 'VIDEO'}</p>
                        <p class="text-xs font-bold truncate">${item.name}</p>
                    </div>
                </div>
            `).join('');
            renderPagination(Math.ceil(filtered.length / pageSize));
        }

        function renderTagCloud() {
            const map = {};
            collections.forEach(i => (i.tags || []).forEach(t => map[t] = (map[t] || 0) + 1));
            document.getElementById('tagCloud').innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([t, c]) => `
                <div onclick="filterByTag('${t}')" class="bg-zinc-900 px-4 py-2 rounded-full text-xs border border-zinc-800 active:scale-95 transition-transform">
                    ${t} <span class="text-zinc-600 ml-1">${c}</span>
                </div>
            `).join('');
        }

        function renderActorList() {
            const map = {};
            collections.forEach(i => {
                const names = i.name.split(/[\s,，、/]+/).filter(n => n.length > 1 && !/[A-Z]+-\d+/.test(n));
                names.forEach(n => map[n] = (map[n] || 0) + 1);
            });
            document.getElementById('actorList').innerHTML = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name, count]) => `
                <div onclick="filterByTag('${name}')" class="flex flex-col items-center active:opacity-60 transition-opacity">
                    <div class="actor-badge"><span class="actor-initials">${name[0]}</span></div>
                    <span class="text-[11px] font-bold text-zinc-300 truncate w-full text-center">${name}</span>
                    <div class="actor-count-tag">${count} 作品</div>
                </div>
            `).join('');
        }

        // --- 工具函數 ---
        function filterByTag(t) { document.getElementById('searchInput').value = t; switchTab(0); renderGallery(); }
        function debouncedRender() { clearTimeout(window.renderTimer); window.renderTimer = setTimeout(renderGallery, 300); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = 1; setTimeout(()=>t.style.opacity=0, 2000); }
        function updateLayout(c) { 
            currentLayout = c; 
            localStorage.setItem('NF_LAYOUT', c);
            document.getElementById('layoutBtn1').className = c===1 ? "flex-1 py-3 rounded text-xs font-bold bg-white text-black" : "flex-1 py-3 rounded text-xs font-bold bg-zinc-800 text-zinc-500";
            document.getElementById('layoutBtn2').className = c===2 ? "flex-1 py-3 rounded text-xs font-bold bg-white text-black" : "flex-1 py-3 rounded text-xs font-bold bg-zinc-800 text-zinc-500";
            renderGallery(); 
        }

        function openDrawer(id = null) {
            currentId = id;
            document.getElementById('drawer').classList.add('open');
            if(id) {
                const item = collections.find(i => String(i.id) === String(id));
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
            } else {
                ['nameInput','codeInput','urlInput','tagsInput','imgInput'].forEach(k => document.getElementById(k).value = "");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
        }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
        function toggleFilterDrawer(o) { document.getElementById('filterDrawer').classList.toggle('open', o); }
        
        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            if(!name) return showToast("名稱必填");
            const data = {
                id: currentId || Date.now().toString(),
                name,
                code: document.getElementById('codeInput').value.toUpperCase(),
                url: document.getElementById('urlInput').value,
                tags: document.getElementById('tagsInput').value.split(/\s+/).filter(t=>t),
                img: document.getElementById('imgInput').value
            };
            if(currentId) collections[collections.findIndex(i => String(i.id) === String(currentId))] = data;
            else collections.unshift(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery(); closeDrawer(); showToast("已儲存");
        }

        function requestDelete() { document.getElementById('confirmModal').classList.remove('hidden'); }
        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
        function executeDelete() {
            collections = collections.filter(i => String(i.id) !== String(currentId));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            closeConfirm(); closeDrawer(); renderGallery();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(collections)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vault_backup.json'; a.click();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                collections = JSON.parse(ev.target.result);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
                renderGallery(); showToast("導出成功");
            };
            reader.readAsText(e.target.files[0]);
        }

        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if (total <= 1) { container.innerHTML = ""; return; }
            container.innerHTML = `<div class="flex gap-2">` + 
                Array.from({length: total}, (_, i) => i + 1).map(p => 
                    `<div onclick="currentPage=${p};renderGallery();window.scrollTo(0,0)" class="w-8 h-8 flex items-center justify-center rounded-full text-xs font-bold ${p===currentPage ? 'bg-red-600' : 'bg-zinc-900'}">${p}</div>`
                ).join('') + `</div>`;
        }

        function refreshAndHome() {
            document.getElementById('searchInput').value = "";
            currentPage = 1;
            switchTab(0);
            renderGallery();
        }

        window.onload = () => {
            initPattern();
            if(sessionStorage.getItem('LOCKED') === 'false') unlockVault();
        };
    </script>
</body>
</html>
