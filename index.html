<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>netflav - Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #141414;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --icon-size: 20px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden; 
        }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* 靜態 LED 狀態指示燈 */
        .status-led {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px currentColor;
            transition: color 0.3s, background-color 0.3s;
        }
        .led-active { color: #22c55e; background-color: #22c55e; }
        .led-paused { color: #ef4444; background-color: #ef4444; }

        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; align-items: flex-start; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; height: auto; max-height: 100vh; overflow: hidden; }
        .page-content.active-page { max-height: none; overflow: visible; }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
            padding: 0 20px;
        }
        .header-center-box { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; }
        .brand-logo { color: var(--nf-red); font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #71717a; transition: color 0.2s; height: 100%;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; line-height: 1; }
        .nav-item svg { width: var(--icon-size); height: var(--icon-size); }

        .poster-card {
            position: relative; background: #111; border-radius: 8px; overflow: hidden;
            aspect-ratio: 16 / 9; width: 100%; margin-bottom: 8px;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .grid-cols-2 .poster-card { aspect-ratio: 3 / 4; }

        .action-circle-btn {
            position: absolute; width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 50; border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; transition: transform 0.2s;
            cursor: pointer; pointer-events: auto;
        }
        .card-edit-btn { top: 10px; right: 10px; }
        .card-play-btn { bottom: 10px; right: 10px; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
            pointer-events: none; z-index: 10;
        }

        .page-dot-container { display: flex; flex-direction: column; gap: 16px; justify-content: center; align-items: center; padding: 20px 0 60px 0; width: 100%; }
        .pagination-dots-row { display: flex; gap: 8px; justify-content: center; align-items: center; overflow-x: auto; scrollbar-width: none; width: 100%; }
        .page-dot { min-width: 32px; height: 32px; border-radius: 50%; background-color: #1a1a1e; color: #71717a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; transition: all 0.3s; flex-shrink: 0; }
        .page-dot.active { background-color: var(--nf-red); color: white; transform: scale(1.1); }

        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background-color: var(--nf-black); transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; overflow-y: auto; padding: 25px;
        }
        .drawer.open { transform: translateY(0); }

        .search-input { width: 100%; background-color: #18181b; border: none; border-radius: 8px; padding: 0.85rem 1rem 0.85rem 3rem; font-size: 0.875rem; color: white; outline: none; }
        
        #authOverlay { position: fixed; inset: 0; background-color: var(--nf-black); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .tag-pill {
            background: #1a1a1b; color: #e4e4e7; padding: 8px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 500; border: 1px solid #27272a;
            display: flex; align-items: center; gap: 8px;
        }

        #toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            background: white; color: black; padding: 10px 24px; 
            border-radius: 999px; text-xs; font-bold; z-index: 7000; 
            opacity: 0; transition: all 0.3s; pointer-events: none; 
        }

        /* 重複警告樣式 */
        .input-error { color: var(--nf-red) !important; border: 1px solid var(--nf-red) !important; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo mb-10 tracking-widest">Netflav</h1>
        <div id="patternContainer">
            <canvas id="patternCanvas" width="300" height="300"></canvas>
        </div>
        <p class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">請繪製圖形解鎖</p>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="header-center-box">
            <div class="brand-logo" id="logoTitle" onclick="refreshAndHome()">Netflav</div>
            <div class="led-trigger" onclick="toggleAutoLogout()">
                <span id="statusLed" class="status-led led-active"></span>
            </div>
        </div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            <div id="page1" class="page-content active-page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded tracking-tighter">0 ITEMS</span>
                </div>
                
                <div class="relative mb-6">
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋影片..." class="search-input">
                </div>

                <div id="gallery" class="grid gap-4"></div>
                <div id="paginationContainer" class="page-dot-container mt-8"></div>
            </div>

            <div id="page2" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">標籤分類</h2>
                <div id="tagCloud" class="flex flex-wrap gap-3 px-2"></div>
            </div>
            
            <div id="page3" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">演員列表</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-10 gap-x-2 text-center"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" id="navHome" onclick="switchTab(0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>首頁</span>
        </div>
        <div class="nav-item" onclick="switchTab(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path></svg>
            <span>標籤</span>
        </div>
        <div class="nav-item" onclick="openDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>新增</span>
        </div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>設定</span>
        </div>
    </nav>

    <div id="drawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">影片資訊</h3>
            <button onclick="closeDrawer()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="space-y-6">
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">名稱 / 演員</label><input type="text" id="nameInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">番號 (ID)</label><input type="text" id="codeInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">連結 (URL)</label><input type="text" id="urlInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">標籤</label><input type="text" id="tagsInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">封面圖片</label><input type="text" id="imgInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
            <div class="pt-10 space-y-4">
                <button onclick="saveItem()" class="w-full bg-red-600 py-4 font-bold rounded-lg shadow-lg">儲存內容</button>
                <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full py-2 text-zinc-600 text-xs font-bold hidden">刪除此項目</button>
            </div>
        </div>
    </div>

    <div id="filterDrawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">帳戶設定</h3>
            <button onclick="toggleFilterDrawer(false)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
        </div>
        <div class="space-y-4">
            <button onclick="updateLayout(1)" class="w-full py-4 bg-zinc-900 rounded font-bold">單欄模式</button>
            <button onclick="updateLayout(2)" class="w-full py-4 bg-zinc-900 rounded font-bold">雙欄模式</button>
            <button onclick="lockApp()" class="w-full py-4 text-red-600 font-bold">立即登出</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-8">
        <div class="text-center"><h4 class="text-xl font-bold mb-8">確定要刪除嗎？</h4><div class="flex flex-col gap-4"><button onclick="executeDelete()" class="w-64 bg-red-600 py-4 font-bold rounded-lg">刪除</button><button onclick="closeConfirm()" class="py-2 text-zinc-500">取消</button></div></div>
    </div>
    <div id="toast"></div>

    <script>
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        const CORRECT_PATTERN = "0124678";
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null, currentPage = 1, pageSize = 12, currentLayout = 1;

        // --- 核心邏輯：重複檢查 ---
        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const url = document.getElementById('urlInput').value.trim();
            const img = document.getElementById('imgInput').value.trim();
            
            if(!name) { showToast("請輸入名稱"); return; }

            // 取得除了當前正在編輯的項目以外的所有資料
            const otherItems = collections.filter(i => String(i.id) !== String(currentId));

            // 檢查重複
            const isCodeDup = code && otherItems.some(i => i.code === code);
            const isUrlDup = url && otherItems.some(i => i.url === url);
            const isImgDup = img && otherItems.some(i => i.img === img);

            if (isCodeDup || isUrlDup || isImgDup) {
                showToast("偵測到重複資料！請檢查標記欄位");
                
                // 變色處理
                if (isCodeDup) document.getElementById('codeInput').style.color = 'var(--nf-red)';
                if (isUrlDup) document.getElementById('urlInput').style.color = 'var(--nf-red)';
                if (isImgDup) document.getElementById('imgInput').style.color = 'var(--nf-red)';
                
                return; // 攔截不儲存
            }

            const data = {
                id: currentId || Date.now().toString(),
                name, code, url, img,
                tags: document.getElementById('tagsInput').value.trim().split(/\s+/).filter(t => t)
            };

            if(currentId) collections[collections.findIndex(i => String(i.id) === String(currentId))] = data;
            else collections.unshift(data);

            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery();
            closeDrawer();
            showToast("儲存成功");
        }

        // --- 輸入時恢復顏色 ---
        ['codeInput', 'urlInput', 'imgInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                this.style.color = 'white';
            });
        });

        // --- UI & 渲染邏輯 (簡化版整合) ---
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = collections.filter(i => i.name.toLowerCase().includes(query) || (i.code||"").toLowerCase().includes(query));
            
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            gallery.className = `grid gap-4 ${currentLayout === 2 ? 'grid-cols-2' : 'grid-cols-1'}`;
            
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card">
                    <img src="${item.img || 'https://via.placeholder.com/400x225/111/333?text=No+Image'}">
                    <div class="action-circle-btn card-edit-btn" onclick="openDrawer('${item.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></div>
                    <div class="card-overlay"><p class="text-[9px] font-black text-red-600 mb-0.5">${item.code || ''}</p><p class="text-[13px] font-bold truncate">${item.name}</p></div>
                </div>
            `).join('');
            renderPagination(Math.ceil(filtered.length / pageSize));
        }

        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if (total <= 1) { container.innerHTML = ""; return; }
            let dots = "";
            for (let i = 1; i <= total; i++) {
                dots += `<div onclick="currentPage=${i};renderGallery();window.scrollTo(0,0)" class="page-dot ${i === currentPage ? 'active' : ''}">${i}</div>`;
            }
            container.innerHTML = `<div class="pagination-dots-row">${dots}</div>`;
        }

        function openDrawer(id = null) {
            currentId = id;
            const drawer = document.getElementById('drawer');
            drawer.classList.add('open');
            // 重置所有輸入顏色
            ['nameInput','codeInput','urlInput','tagsInput','imgInput'].forEach(k => {
                const el = document.getElementById(k);
                el.value = "";
                el.style.color = "white";
            });

            if(id) {
                const item = collections.find(i => String(i.id) === String(id));
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
            } else {
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
        }

        // --- 其他系統功能 ---
        function switchTab(index) {
            document.getElementById('pageContainer').style.transform = `translateX(-${index * (100/3)}%)`;
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));
            if(index === 1) renderTagCloud();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        function lockApp() { sessionStorage.removeItem('VAULT_UNLOCKED'); location.reload(); }
        function unlockVault() { 
            sessionStorage.setItem('VAULT_UNLOCKED', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            document.getElementById('bottomNav').style.visibility = 'visible';
            renderGallery();
        }

        // --- 解鎖畫布邏輯 ---
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        let selectedNodes = [], isDrawing = false;
        const nodes = [];
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) nodes.push({ id: (i * 3 + j).toString(), x: 50 + j * 100, y: 50 + i * 100 });

        function draw() {
            ctx.clearRect(0,0,300,300);
            nodes.forEach(n => {
                ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI*2);
                ctx.fillStyle = selectedNodes.includes(n.id) ? "#E50914" : "#222";
                ctx.fill();
            });
            if(isDrawing) requestAnimationFrame(draw);
        }

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; selectedNodes = []; draw(); });
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            nodes.forEach(n => {
                if(Math.hypot(x-n.x, y-n.y) < 25 && !selectedNodes.includes(n.id)) selectedNodes.push(n.id);
            });
        });
        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            if(selectedNodes.join('') === CORRECT_PATTERN) unlockVault();
            else { selectedNodes = []; draw(); }
        });

        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
        function toggleFilterDrawer(open) { document.getElementById('filterDrawer').classList.toggle('open', open); }
        function updateLayout(l) { currentLayout = l; renderGallery(); toggleFilterDrawer(false); }

        window.onload = () => { if(sessionStorage.getItem('VAULT_UNLOCKED')) unlockVault(); else draw(); };
    </script>
</body>
</html>
