<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NF MOBILE ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #141414;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --icon-size: 20px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 呼吸燈動畫：用於暫停狀態 */
        @keyframes pulse-dot-red {
            0%, 100% { background-color: #ff0000; box-shadow: 0 0 2px #ff0000; }
            50% { background-color: #550000; box-shadow: 0 0 10px #ff0000; }
        }

        /* 狀態燈樣式 */
        #statusDot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-left: 10px; vertical-align: middle;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot-protected { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; } 
        .dot-paused { animation: pulse-dot-red 1.2s infinite; }

        /* 區段頁碼樣式 */
        .page-segment-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; padding: 40px 0; color: #71717a; font-weight: bold;
        }
        .page-btn {
            background: #1a1a1e; padding: 8px 18px; border-radius: 6px;
            font-size: 12px; transition: all 0.2s; color: #eee;
            border: 1px solid #333;
        }
        .page-btn:active { background: #333; transform: scale(0.9); }
        .page-btn.disabled { opacity: 0.1; pointer-events: none; }

        /* 全域核心樣式 */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .shake { animation: shake 0.4s both; }
        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; }
        .mobile-header { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height); z-index: 1000; display: flex; align-items: center; justify-content: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%); backdrop-filter: blur(10px); }
        .brand-logo { color: var(--nf-red); font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom)); background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000; display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #71717a; transition: color 0.2s; height: 100%; }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; }
        .poster-card { position: relative; background: #111; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; width: 100%; margin-bottom: 8px; }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; pointer-events: none; }
        #authOverlay { position: fixed; inset: 0; background-color: var(--nf-black); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .search-input { width: 100%; background-color: #18181b; border: none; border-radius: 8px; padding: 0.85rem 1rem 0.85rem 3rem; font-size: 0.875rem; color: white; outline: none; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo mb-10 tracking-widest">Netflav</h1>
        <div id="patternContainer">
            <canvas id="patternCanvas" width="300" height="300"></canvas>
        </div>
        <p id="authHint" class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">請繪製圖形解鎖</p>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="flex items-center">
            <div class="brand-logo" id="logoTitle" onclick="handleLogoClick()">Netflav</div>
            <div id="statusDot" class="dot-protected" onclick="toggleAutoLogout()"></div>
        </div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            <div id="page1" class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded">0 ITEMS</span>
                </div>
                <div class="relative mb-6">
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋..." class="search-input">
                </div>
                <div id="gallery" class="grid grid-cols-1 gap-4"></div>
                
                <div id="paginationContainer"></div> 
            </div>
            
            <div id="page2" class="page-content"><div id="tagCloud" class="flex flex-wrap gap-3"></div></div>
            <div id="page3" class="page-content"><div id="actorList" class="grid grid-cols-3 gap-y-10"></div></div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" onclick="switchTab(0)"><span>首頁</span></div>
        <div class="nav-item" onclick="switchTab(1)"><span>標籤</span></div>
        <div class="nav-item" onclick="switchTab(2)"><span>演員</span></div>
        <div class="nav-item" onclick="showToast('功能開發中')"><span>設定</span></div>
    </nav>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 transition-all pointer-events-none"></div>

    <script>
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        const CORRECT_PATTERN = "0124678";
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentPage = 1, pageSize = 12;

        // --- 1. 自動登出與狀態指示燈邏輯 ---
        let logoutTimer = null;
        let isAutoLogoutPaused = false;
        const AUTO_LOGOUT_SECONDS = 300; // 5分鐘

        function updateStatusUI() {
            const dot = document.getElementById('statusDot');
            if (isAutoLogoutPaused) {
                dot.className = 'dot-paused';
                showToast("自動登出：已暫停");
            } else {
                dot.className = 'dot-protected';
                showToast("自動登出：保護中");
                resetLogoutTimer();
            }
        }

        function toggleAutoLogout() {
            isAutoLogoutPaused = !isAutoLogoutPaused;
            updateStatusUI();
        }

        function resetLogoutTimer() {
            if (isAutoLogoutPaused || document.getElementById('authOverlay').style.display !== 'none') {
                if (logoutTimer) clearTimeout(logoutTimer);
                return;
            }
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => {
                sessionStorage.removeItem('VAULT_UNLOCKED');
                location.reload();
            }, AUTO_LOGOUT_SECONDS * 1000);
        }

        // 長按 Logo 也能切換狀態
        let logoTimer;
        function handleLogoClick() { /* 普通點擊不觸發，避免誤觸 */ }
        const logoEl = document.getElementById('logoTitle');
        logoEl.addEventListener('touchstart', () => logoTimer = setTimeout(toggleAutoLogout, 800));
        logoEl.addEventListener('touchend', () => clearTimeout(logoTimer));

        // 監控任何觸摸動作來重置計時器
        window.addEventListener('touchstart', resetLogoutTimer);

        // --- 2. 區段式頁碼邏輯 ---
        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if (total <= 1) { container.innerHTML = ""; return; }

            container.innerHTML = `
                <div class="page-segment-nav">
                    <div class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})">PREV</div>
                    <div class="text-white text-sm tracking-widest">
                        <span class="text-red-600">${currentPage}</span> / ${total}
                    </div>
                    <div class="page-btn ${currentPage === total ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})">NEXT</div>
                </div>
            `;
        }

        function changePage(p) {
            currentPage = p;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderGallery();
        }

        // --- 3. 核心功能 (解鎖、渲染) ---
        function unlockVault() {
            sessionStorage.setItem('VAULT_UNLOCKED', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            document.getElementById('bottomNav').style.visibility = 'visible';
            renderGallery();
            resetLogoutTimer();
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => i.name.toLowerCase().includes(query));
            
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            const totalPages = Math.ceil(filtered.length / pageSize);
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

            if (paginated.length === 0) {
                gallery.innerHTML = '<p class="text-center text-zinc-600 py-10">尚無內容</p>';
                renderPagination(0);
                return;
            }

            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card">
                    <img src="${item.img || 'https://via.placeholder.com/640x360'}" loading="lazy">
                    <div class="card-overlay">
                        <p class="text-[13px] font-bold truncate">${item.name}</p>
                    </div>
                </div>
            `).join('');
            
            renderPagination(totalPages);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        function switchTab(index) {
            document.getElementById('pageContainer').style.transform = `translateX(-${index * (100/3)}%)`;
            const navs = document.querySelectorAll('.nav-item');
            navs.forEach((n, i) => n.classList.toggle('active', i === index));
        }

        function debouncedRender() { 
            currentPage = 1; // 搜尋時回到第一頁
            clearTimeout(window.timer); 
            window.timer = setTimeout(renderGallery, 300); 
        }

        // --- 圖形解鎖 (簡易實現) ---
        const canvas = document.getElementById('patternCanvas');
        const nodes = [];
        for(let i=0; i<3; i++) for(let j=0; j<3; j++) nodes.push({id:(i*3+j).toString(), x:50+j*100, y:50+i*100});
        let selected = [];
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); selected = []; });
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
            nodes.forEach(n => {
                if(Math.hypot(x-n.x, y-n.y) < 30 && !selected.includes(n.id)) {
                    selected.push(n.id);
                    if(navigator.vibrate) navigator.vibrate(10);
                }
            });
        });
        canvas.addEventListener('touchend', () => {
            if(selected.join('') === CORRECT_PATTERN) unlockVault();
            else {
                document.getElementById('patternContainer').classList.add('shake');
                setTimeout(() => document.getElementById('patternContainer').classList.remove('shake'), 400);
            }
        });

        window.onload = () => { 
            if(sessionStorage.getItem('VAULT_UNLOCKED') === 'true') unlockVault(); 
        };
    </script>
</body>
</html>
