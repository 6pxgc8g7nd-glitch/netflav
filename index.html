<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TOPTOON">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTOON 漫畫紀錄網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f5f5f5;
            color: #171717;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Mobile App Frame Styling */
        .app-container {
            max-width: 480px;
            width: 100%;
            height: 100dvh;
            margin: 0 auto;
            background-color: #fafafa;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#f5f5f5] flex justify-center items-center h-[100dvh]">

    <div class="app-container">

        <!-- Top Header -->
        <header class="w-full py-3 px-4 bg-[#ffffff] shadow-md flex items-center justify-between flex-shrink-0 z-50 border-b border-[#e5e5e5]/50">
            <div onclick="goHome()" class="flex items-center space-x-2 cursor-pointer active:opacity-80 transition">
                <h1 class="text-xl font-black tracking-wider">
                    <span class="text-[#a6051a]">TOP</span><span class="text-neutral-900">TOON</span>
                </h1>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 w-full p-3.5 pb-24 overflow-y-auto">

            <!-- TAB 1: 首頁 (Home) -->
            <section id="tab-home" class="space-y-3">
                <!-- Comic List -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-xs text-neutral-600 flex items-center space-x-1.5 uppercase tracking-wide">
                            <i class="fa-solid fa-bookmark text-[#a6051a] text-xs"></i>
                            <span>漫畫清單</span>
                        </h3>
                        <span id="comicCount" class="text-[11px] text-neutral-600 font-medium">共 0 部</span>
                    </div>
                    
                    <!-- Active Filter Banner -->
                    <div id="filterBannerContainer"></div>

                    <div id="comicListContainer" class="grid grid-cols-2 gap-3">
                        <!-- Dynamic Comics injected here -->
                    </div>
                    <div id="paginationContainer" class="flex items-center justify-center gap-3 pt-3 pb-2"></div>
                </div>
            </section>

            <!-- TAB 2: 分類 (Categories) -->
            <section id="tab-categories" class="hidden space-y-4">
                <div class="bg-[#ffffff] rounded-xl p-4 shadow border border-[#e5e5e5]/40">
                    <h2 class="text-base font-bold mb-1">漫畫分類瀏覽</h2>
                    <p class="text-xs text-neutral-600">點擊下方分類標籤可快速篩選對應漫畫</p>
                </div>

                <!-- Genre Grid -->
                <div class="grid grid-cols-2 gap-2.5" id="genreGrid">
                    <!-- Dynamic categories -->
                </div>
            </section>

            <!-- TAB 3: 新增 (Add) -->
            <section id="tab-add" class="hidden space-y-3.5">
                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-[#a6051a]/10 text-[#a6051a] flex items-center justify-center text-base border border-[#a6051a]/30 flex-shrink-0">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-neutral-900">新增漫畫</h2>
                        <p class="text-[10px] text-neutral-600">記錄漫畫名稱、分類、狀態、網址與封面</p>
                    </div>
                </div>

                <form id="addComicForm" onsubmit="handleAddNewComic(event)" class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-[#a6051a] text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="inputTitle" required placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-[#a6051a] text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="inputGenre" required placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-[#a6051a] text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="連載中" checked class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="已完結" class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">已完結</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-[#a6051a] text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="inputUrl" placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-[#a6051a] text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="inputCoverUrl" placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-bookmark text-[#a6051a] text-[10px]"></i>
                            <span>閱讀進度（第幾話）</span>
                        </label>
                        <input type="number" id="inputProgress" min="0" step="1" placeholder="例如：45" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <button type="submit" class="w-full bg-[#a6051a] hover:bg-[#8a0416] active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>確認新增漫畫</span>
                    </button>
                </form>
            </section>

            <!-- TAB 4: 設定 (Settings) -->
            <section id="tab-settings" class="hidden space-y-3.5">
                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-[#a6051a]/10 text-[#a6051a] flex items-center justify-center text-base border border-[#a6051a]/30 flex-shrink-0">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-neutral-900">設定與備份</h2>
                        <p class="text-[10px] text-neutral-600">管理您的漫畫資料與備份</p>
                    </div>
                </div>

                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 space-y-3">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-bold text-neutral-600">資料備份與還原</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportData()" class="bg-[#fafafa] hover:bg-[#e5e5e5] active:scale-95 text-neutral-900 font-bold py-2.5 rounded-xl transition text-xs border border-[#a6051a]/40 flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-download text-xs text-[#a6051a]"></i>
                                <span>匯出備份</span>
                            </button>
                            <label class="bg-[#fafafa] hover:bg-[#e5e5e5] active:scale-95 text-neutral-900 font-bold py-2.5 rounded-xl transition text-xs border border-[#a6051a]/40 flex items-center justify-center space-x-1.5 cursor-pointer">
                                <i class="fa-solid fa-upload text-xs text-[#a6051a]"></i>
                                <span>還原備份</span>
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Rounded Floating Bottom Navigation Bar -->
        <nav class="absolute bottom-3 left-3 right-3 bg-[#a6051a] z-40 max-w-[456px] mx-auto shadow-2xl rounded-2xl overflow-hidden flex-shrink-0">
            <div class="grid grid-cols-4 h-14 text-center">
                <!-- Tab 1: 首頁 -->
                <button onclick="goHome()" id="nav-home" class="nav-btn flex flex-col items-center justify-center text-white font-bold transition active:bg-white/10">
                    <i class="fa-solid fa-house text-sm mb-0.5"></i>
                    <span class="text-[10px]">首頁</span>
                </button>
                <!-- Tab 2: 分類 -->
                <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center justify-center text-white/50 font-medium transition active:bg-white/10">
                    <i class="fa-solid fa-compass text-sm mb-0.5"></i>
                    <span class="text-[10px]">分類</span>
                </button>
                <!-- Tab 3: 新增 -->
                <button onclick="switchTab('add')" id="nav-add" class="nav-btn flex flex-col items-center justify-center text-white/50 font-medium transition active:bg-white/10">
                    <i class="fa-solid fa-circle-plus text-sm mb-0.5"></i>
                    <span class="text-[10px]">新增</span>
                </button>
                <!-- Tab 4: 設定 -->
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center text-white/50 font-medium transition active:bg-white/10">
                    <i class="fa-solid fa-gear text-sm mb-0.5"></i>
                    <span class="text-[10px]">設定</span>
                </button>
            </div>
        </nav>

        <!-- Comic Detail Modal -->
        <div id="comicModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#e5e5e5] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3 max-h-[85vh] overflow-y-auto">
                <button onclick="closeComicModal()" class="absolute top-3 right-3 text-[#a6051a] hover:text-[#8a0416] p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center space-x-3 pr-6">
                    <div id="modalEmojiContainer" class="w-12 h-12 bg-[#fafafa] rounded-xl flex items-center justify-center text-2xl  shadow-inner flex-shrink-0 overflow-hidden">
                        📖
                    </div>
                    <div>
                        <h3 id="modalTitle" class="text-base font-bold">漫畫名稱</h3>
                        <p id="modalGenre" class="text-[11px] text-neutral-600">分類</p>
                    </div>
                </div>

                <div id="modalUrlBox" class="hidden">
                    <a id="modalUrlLink" href="#" target="_blank" class="w-full bg-[#a6051a] hover:bg-[#8a0416] active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-external-link-alt text-xs"></i>
                        <span>前往漫畫網站閱讀</span>
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="openEditModal()" class="bg-gray-700 hover:bg-gray-600 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-[#a6051a]/40">
                        <i class="fa-solid fa-pen text-xs"></i>
                        <span>修改</span>
                    </button>
                    <button onclick="deleteCurrentComic()" class="bg-white hover:bg-neutral-100 active:scale-95 text-[#a6051a] py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-[#a6051a]/40">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                        <span>刪除</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Comic Modal -->
        <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#e5e5e5] rounded-xl w-full max-w-xs p-3.5 shadow-2xl relative space-y-2.5 max-h-[90vh] overflow-y-auto">
                <button onclick="closeEditModal()" class="absolute top-2.5 right-2.5 text-[#a6051a] hover:text-[#8a0416] p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
                <h3 class="text-xs font-black tracking-wide text-neutral-900 mb-1.5 flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-[#a6051a]"></i>
                    <span>修改漫畫紀錄</span>
                </h3>
                <form id="editComicForm" onsubmit="handleUpdateComic(event)" class="space-y-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-[#a6051a] text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="editInputTitle" required class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-[#a6051a] text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="editInputGenre" required class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-[#a6051a] text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="連載中" class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="已完結" class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">已完結</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-[#a6051a] text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="editInputUrl" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-[#a6051a] text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="editInputCoverUrl" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-bookmark text-[#a6051a] text-[10px]"></i>
                            <span>閱讀進度（第幾話）</span>
                        </label>
                        <input type="number" id="editInputProgress" min="0" step="1" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>
                    <div class="flex space-x-2 pt-1">
                        <button type="button" onclick="closeEditModal()" class="flex-1 bg-[#fafafa] hover:bg-[#e5e5e5] active:scale-95 text-neutral-900 font-bold py-2 rounded-xl transition text-xs border border-[#a6051a]/40">取消</button>
                        <button type="submit" class="flex-1 bg-[#a6051a] hover:bg-[#8a0416] active:scale-95 text-white font-bold py-2 rounded-xl shadow transition text-xs">儲存修改</button>
                    </div>
                </form>
            </div>
        </div>

        

        <!-- Notification / Message Box Modal -->
        <div id="msgModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#e5e5e5] rounded-xl w-full max-w-[280px] p-4 shadow-2xl text-center space-y-3">
                <div id="msgIcon" class="w-10 h-10 rounded-full bg-[#a6051a]/10 text-[#a6051a] flex items-center justify-center mx-auto text-base">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 id="msgTitle" class="font-bold text-sm">提示訊息</h3>
                <p id="msgText" class="text-xs text-neutral-600">操作成功</p>
                <button onclick="closeMsgModal()" class="w-full bg-[#a6051a] hover:bg-[#8a0416] active:scale-95 text-white font-bold py-2 rounded-lg transition text-xs">確定</button>
            </div>
        </div>

    </div>

    <script>
        let comics = JSON.parse(localStorage.getItem('toptoon_comics')) || [];
        if (!localStorage.getItem('toptoon_comics')) {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        let activeComicId = null;
        let activeGenreFilter = '全部';
        let currentPage = 1;
        const comicsPerPage = 10;
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function safeUrl(url) {
            if (!url) return '';
            try {
                const parsed = new URL(url, location.href);
                return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
            } catch (e) {
                return '';
            }
        }

        // 把輸入轉成合法的進度數字：空白、負數、亂填都變成 0（0 代表未填）
        function parseProgress(value) {
            const n = parseInt(value, 10);
            if (!Number.isFinite(n) || n < 0) return 0;
            return Math.min(n, 99999);
        }

        function parseGenres(genreStr) {
            if (!genreStr || genreStr.trim() === '') return ['未分類'];
            return genreStr.split(/[,，]/).map(g => g.trim()).filter(g => g.length > 0);
        }

        function handleImgError(imgEl) {
            const parent = imgEl.parentElement;
            parent.innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl">📖</div>';
        }

        function saveComics() {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        function showMsg(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.app-container > main > section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(`tab-${tabName}`);
            if (targetSection) {
                targetSection.classList.remove('hidden');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white', 'font-bold');
                btn.classList.add('text-white/50', 'font-medium');
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-white/50', 'font-medium');
                activeBtn.classList.add('text-white', 'font-bold');
            }

            if(tabName === 'home') renderComics();
            if(tabName === 'categories') renderCategories();
        }
        function goHome() {
            currentPage = 1;
            activeGenreFilter = '全部';
            switchTab('home');
        
            const main = document.querySelector('.app-container > main');
            if (main) {
                main.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function filterByGenre(genre) {
            activeGenreFilter = genre;
            currentPage = 1;
            switchTab('home');
        }

        function clearGenreFilter() {
            activeGenreFilter = '全部';
            currentPage = 1;
            renderComics();
        }

        function renderComics() {
            const container = document.getElementById('comicListContainer');
            const filterBannerContainer = document.getElementById('filterBannerContainer');

            if (activeGenreFilter !== '全部') {
                filterBannerContainer.innerHTML = `
                    <div class="bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3 py-2 flex items-center justify-between text-xs shadow-inner mb-2.5">
                        <span class="text-neutral-600">分類篩選：<strong class="text-neutral-900">${escapeHtml(activeGenreFilter)}</strong></span>
                        <button onclick="clearGenreFilter()" class="text-[#a6051a] hover:text-[#8a0416] p-1" aria-label="清除篩選">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                `;
            } else {
                filterBannerContainer.innerHTML = '';
            }

            const filteredComics = activeGenreFilter === '全部' ?
                comics :
                comics.filter(c => parseGenres(c.genre).includes(activeGenreFilter));

            document.getElementById('comicCount').innerText = `共 ${filteredComics.length} 部`;

            if (filteredComics.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#ffffff] rounded-xl p-6 text-center border border-[#a6051a]/40 text-neutral-600 space-y-2 col-span-2">
                        <i class="fa-solid fa-box-open text-2xl"></i>
                        <p class="text-xs">目前沒有符合的漫畫紀錄</p>
                    </div>
                `;
                renderPagination(0);
                return;
            }

            // 每頁只顯示 10 部漫畫
            const totalPages = Math.ceil(filteredComics.length / comicsPerPage);

            // 刪除資料後，如果目前頁數超出範圍，自動回到最後一頁
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            const startIndex = (currentPage - 1) * comicsPerPage;
            const paginatedComics = filteredComics.slice(startIndex, startIndex + comicsPerPage);

            container.className = "grid grid-cols-2 gap-3";

            container.innerHTML = paginatedComics.map(comic => {
                const coverSrc = safeUrl(comic.coverUrl);
                const coverDisplay = coverSrc ?
                    `<div class="w-full aspect-[3/4] bg-[#fafafa] rounded-t-xl overflow-hidden relative ">
                        <img src="${escapeHtml(coverSrc)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleImgError(this)">
                     </div>` :
                    `<div class="w-full aspect-[3/4] bg-[#fafafa] rounded-t-xl flex items-center justify-center text-3xl relative">
                        📖
                     </div>`;

                const statusBadge = comic.status ? `<span class="inline-block text-[9px] ${comic.status === '連載中' ? 'bg-[#a6051a]/10 text-[#a6051a]' : 'bg-gray-200 text-gray-700'} px-1.5 py-0.5 rounded border border-[#a6051a]/40 w-fit">${escapeHtml(comic.status)}</span>` : '';

                // 閱讀進度：舊資料沒有 progress（undefined），不會顯示
                const progressText = comic.progress > 0 ? `<span class="text-[10px] text-neutral-600 ml-auto">第 ${parseInt(comic.progress, 10)} 話</span>` : '';

                return `
                    <div data-id="${escapeHtml(comic.id)}" onclick="openComicModal(this.dataset.id)" class="group bg-[#ffffff] hover:bg-[#f0f0f0]  rounded-xl shadow transition cursor-pointer overflow-hidden flex flex-col active:scale-[0.98]">
                        ${coverDisplay}
                        <div class="p-2.5 flex flex-col justify-between flex-1 space-y-1.5">
                            <h4 class="font-bold text-neutral-900 text-xs line-clamp-1">${escapeHtml(comic.title)}</h4>
                            <div class="flex items-center space-x-1 flex-wrap gap-1">
                                ${statusBadge}
                                ${progressText}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        // 先提供簡單的「上一頁／下一頁」分頁
        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if (!container) return;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button
                    onclick="changePage(${currentPage - 1})"
                    ${currentPage === 1 ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white ${currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-neutral-700 active:bg-gray-100'}">
                    上一頁
                </button>

                <span class="text-xs text-gray-500 min-w-[70px] text-center">
                    第 ${currentPage} / ${totalPages} 頁
                </span>

                <button
                    onclick="changePage(${currentPage + 1})"
                    ${currentPage === totalPages ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white ${currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-neutral-700 active:bg-gray-100'}">
                    下一頁
                </button>
            `;
        }

        function changePage(page) {
            const filteredCount = activeGenreFilter === '全部' ?
                comics.length :
                comics.filter(c => parseGenres(c.genre).includes(activeGenreFilter)).length;

            const totalPages = Math.ceil(filteredCount / comicsPerPage);

            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderComics();

            // 換頁後回到漫畫列表頂端
            const main = document.querySelector('.app-container > main');
            if (main) {
                main.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderCategories() {
            const genreGrid = document.getElementById('genreGrid');
            let allGenresSet = new Set();
            comics.forEach(c => {
                parseGenres(c.genre).forEach(g => allGenresSet.add(g));
            });
            const genres = ['全部', ...allGenresSet];
        
            genreGrid.innerHTML = genres.map(g => {
                const count = g === '全部' ? comics.length : comics.filter(c => parseGenres(c.genre).includes(g)).length;
                const isSelected = activeGenreFilter === g;
                const activeStyle = isSelected ? 'border-[#a6051a] bg-[#f0f0f0] ring-1 ring-[#a6051a]/40' : 'border-[#a6051a]/40 hover:border-[#a6051a]';
        
                return `
                    <div data-genre="${escapeHtml(g)}" onclick="filterByGenre(this.dataset.genre)" class="genre-card bg-[#ffffff] ${activeStyle} p-3.5 rounded-xl border flex items-center justify-between shadow cursor-pointer transition active:scale-[0.98]">
                        <span class="font-bold text-xs text-neutral-900">${escapeHtml(g)}</span>
                        <span class="text-xs bg-[#fafafa] px-2 py-0.5 rounded-full text-neutral-600 border border-[#a6051a]/40">${count} 部</span>
                    </div>
                `;
            }).join('');
        }

        function handleAddNewComic(e) {
            e.preventDefault();
            const statusInput = document.querySelector('input[name="inputStatus"]:checked');
            const newComic = {
                id: Date.now().toString(),
                title: document.getElementById('inputTitle').value.trim(),
                genre: document.getElementById('inputGenre').value.trim(),
                status: statusInput ? statusInput.value : '連載中',
                url: safeUrl(document.getElementById('inputUrl').value.trim()),
                coverUrl: safeUrl(document.getElementById('inputCoverUrl').value.trim()),
                progress: parseProgress(document.getElementById('inputProgress').value)
            };

            comics.unshift(newComic);
            saveComics();
            document.getElementById('addComicForm').reset();
            showMsg('新增成功', '已成功將漫畫加入追蹤清單！');
            switchTab('home');
        }

        function openComicModal(id) {
            activeComicId = id;
            const comic = comics.find(c => c.id === id);
            if (!comic) return;
        
            const modalEmojiContainer = document.getElementById('modalEmojiContainer');
            const coverSrc = safeUrl(comic.coverUrl);
            modalEmojiContainer.innerText = '📖';
            if (coverSrc) {
                const img = document.createElement('img');
                img.src = coverSrc;
                img.className = 'w-full h-full object-cover';
                img.onerror = () => { modalEmojiContainer.innerText = '📖'; };
                modalEmojiContainer.innerText = '';
                modalEmojiContainer.appendChild(img);
            }
        
            document.getElementById('modalTitle').innerText = comic.title;
            document.getElementById('modalGenre').innerText = `分類：${comic.genre} | 狀態：${comic.status || '連載中'}`;
        
            const urlBox = document.getElementById('modalUrlBox');
            const urlLink = document.getElementById('modalUrlLink');
            const linkHref = safeUrl(comic.url);
            if (linkHref) {
                urlLink.href = linkHref;
                urlLink.rel = 'noopener noreferrer';
                urlBox.classList.remove('hidden');
            } else {
                urlBox.classList.add('hidden');
            }
                document.getElementById('comicModal').classList.remove('hidden');
        }
        function closeComicModal() {
                document.getElementById('comicModal').classList.add('hidden');
        }

        function openEditModal() {
            closeComicModal();
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;

            document.getElementById('editInputTitle').value = comic.title;
            document.getElementById('editInputGenre').value = comic.genre;
            document.getElementById('editInputUrl').value = comic.url || '';
            document.getElementById('editInputCoverUrl').value = comic.coverUrl || '';
            document.getElementById('editInputProgress').value = comic.progress > 0 ? comic.progress : '';

            const statusRadios = document.querySelectorAll('input[name="editInputStatus"]');
            statusRadios.forEach(radio => {
                radio.checked = (radio.value === (comic.status || '連載中'));
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleUpdateComic(e) {
            e.preventDefault();
            const comicIndex = comics.findIndex(c => c.id === activeComicId);
            if (comicIndex === -1) return;

            const statusInput = document.querySelector('input[name="editInputStatus"]:checked');
            comics[comicIndex].title = document.getElementById('editInputTitle').value.trim();
            comics[comicIndex].genre = document.getElementById('editInputGenre').value.trim();
            comics[comicIndex].status = statusInput ? statusInput.value : '連載中';
            comics[comicIndex].url = safeUrl(document.getElementById('editInputUrl').value.trim());
            comics[comicIndex].coverUrl = safeUrl(document.getElementById('editInputCoverUrl').value.trim());
            comics[comicIndex].progress = parseProgress(document.getElementById('editInputProgress').value);

            saveComics();
            closeEditModal();
            showMsg('修改成功', '漫畫資訊已成功更新！');
            renderComics();
        }

        function deleteCurrentComic() {
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;
        
            if (!confirm(`確定要刪除「${comic.title}」嗎？\n\n刪除後無法復原。`)) return;
        
            comics = comics.filter(c => c.id !== activeComicId);
            saveComics();
            closeComicModal();
            showMsg('刪除成功', '已從追蹤清單移除該漫畫。');
            renderComics();
        }

// ================================
// 資料備份功能
// ================================




// 產生備份檔案名稱
function getBackupFileName() {
    return 'toptoon_backup.json';
}


// 匯出資料
function exportData() {

    if (!Array.isArray(comics)) {
        showMsg(
            '匯出失敗',
            '目前漫畫資料格式異常，無法進行備份。'
        );
        return;
    }

    if (comics.length === 0) {
        showMsg(
            '沒有資料',
            '目前沒有漫畫資料可以匯出。'
        );
        return;
    }

    try {

        const backupData = {
            app: 'TOPTOON 漫畫紀錄網',
            version: 1,
            exportTime: new Date().toISOString(),
            count: comics.length,
            comics: comics
        };

        const jsonData = JSON.stringify(
            backupData,
            null,
            2
        );

        const blob = new Blob(
            [jsonData],
            {
                type: 'application/json;charset=utf-8'
            }
        );

        const downloadUrl =
            URL.createObjectURL(blob);

        const downloadLink =
            document.createElement('a');

        downloadLink.href = downloadUrl;
        downloadLink.download =
            getBackupFileName();

        downloadLink.style.display = 'none';

        document.body.appendChild(downloadLink);

        downloadLink.click();

        document.body.removeChild(downloadLink);

        setTimeout(() => {
            URL.revokeObjectURL(downloadUrl);
        }, 1000);

        showMsg(
            '匯出成功',
            `已成功備份 ${comics.length} 部漫畫資料。`
        );

    } catch (error) {

        console.error(
            'TOPTOON 匯出錯誤：',
            error
        );

        showMsg(
            '匯出失敗',
            '建立備份檔案時發生錯誤，請稍後再試。'
        );
    }
}


// 驗證單筆漫畫資料
function validateComic(comic) {

    if (!comic || typeof comic !== 'object') {
        return false;
    }

    if (
        typeof comic.id !== 'string' ||
        typeof comic.title !== 'string' ||
        typeof comic.genre !== 'string'
    ) {
        return false;
    }

    if (
        comic.status !== undefined &&
        typeof comic.status !== 'string'
    ) {
        return false;
    }

    if (
        comic.url !== undefined &&
        typeof comic.url !== 'string'
    ) {
        return false;
    }

    if (
        comic.coverUrl !== undefined &&
        typeof comic.coverUrl !== 'string'
    ) {
        return false;
    }

    if (
        comic.progress !== undefined &&
        typeof comic.progress !== 'number'
    ) {
        return false;
    }

    return true;
}


// 匯入資料
function importData(e) {

    const file = e.target.files[0];

    if (!file) {
        return;
    }

    // 檢查副檔名
    if (
        !file.name.toLowerCase().endsWith('.json')
    ) {

        showMsg(
            '格式錯誤',
            '請選擇 JSON 備份檔案。'
        );

        e.target.value = '';
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        try {

            const parsedData =
                JSON.parse(event.target.result);

            let importedComics = null;

            // 新版備份格式
            if (
                parsedData &&
                !Array.isArray(parsedData) &&
                Array.isArray(parsedData.comics)
            ) {

                importedComics =
                    parsedData.comics;

            }

            // 相容舊版直接匯出的陣列格式
            else if (
                Array.isArray(parsedData)
            ) {

                importedComics =
                    parsedData;

            }

            else {

                showMsg(
                    '格式錯誤',
                    '這不是有效的 TOPTOON 漫畫備份檔。'
                );

                e.target.value = '';
                return;
            }


            // 檢查每一筆漫畫
            const invalidIndex =
                importedComics.findIndex(
                    comic => !validateComic(comic)
                );

            if (invalidIndex !== -1) {

                showMsg(
                    '資料錯誤',
                    `備份檔第 ${invalidIndex + 1} 筆漫畫資料格式不正確。`
                );

                e.target.value = '';
                return;
            }


            // 防止空資料意外覆蓋
            if (importedComics.length === 0) {

                showMsg(
                    '沒有漫畫資料',
                    '這個備份檔案沒有任何漫畫紀錄。'
                );

                e.target.value = '';
                return;
            }


            // 確認匯入
            const shouldImport = confirm(
                `確定要還原 ${importedComics.length} 部漫畫嗎？\n\n` +
                `目前資料：${comics.length} 部\n` +
                `備份資料：${importedComics.length} 部\n\n` +
                `還原後會取代目前的漫畫資料。`
            );

            if (!shouldImport) {

                e.target.value = '';
                return;
            }


            // 建立新的陣列，避免直接引用 JSON
            comics =
                importedComics.map(comic => ({
                    id: String(comic.id),
                    title: String(comic.title).trim(),
                    genre: String(comic.genre).trim(),
                    status: comic.status || '連載中',
                    url: safeUrl(comic.url),
                    coverUrl: safeUrl(comic.coverUrl),
                    progress: parseProgress(comic.progress)
                }));


            saveComics();

            // 重置分類
            activeGenreFilter = '全部';
            currentPage = 1;

            // 更新畫面
            renderComics();
            renderCategories();
            

            // 清除 file input
            e.target.value = '';

            showMsg(
                '還原成功',
                `已成功還原 ${comics.length} 部漫畫紀錄。`
            );

        } catch (error) {

            console.error(
                'TOPTOON 匯入錯誤：',
                error
            );

            showMsg(
                '讀取失敗',
                '無法解析這個 JSON 備份檔案，請確認檔案沒有損壞。'
            );

            e.target.value = '';
        }
    };


    reader.onerror = function() {

        showMsg(
            '讀取失敗',
            '無法讀取備份檔案。'
        );

        e.target.value = '';
    };


    reader.readAsText(
        file,
        'UTF-8'
    );
}



        // Initialize on load
        window.onload = function() {
            renderComics();
        };
    </script>
