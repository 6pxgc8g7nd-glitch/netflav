<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>netflav</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Netflav">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23000'/%3E%3Cpath d='M160 400V112h56l80 168V112h56v288h-56l-80-168v168z' fill='%23E50914'/%3E%3C/svg%3E">
<script>
/* 先套用外觀設定，避免畫面閃一下 */
(function () {
  try {
    var t = localStorage.getItem('NF_THEME') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    /* 深色 = Netflix 紅，淺色 = YouTube 紅 */
    document.documentElement.style.setProperty('--nf-red', t === 'light' ? '#FF0000' : '#E50914');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#141414');
  } catch (e) {}
})();
/* 產生 app 圖示（180x180 PNG），供 iOS「加入主畫面」使用 */
(function () {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, 180, 180);
    var g = x.createRadialGradient(90, 90, 10, 90, 90, 100);
    g.addColorStop(0, 'rgba(229,9,20,.25)'); g.addColorStop(1, 'rgba(229,9,20,0)');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#E50914';
    x.beginPath();
    x.moveTo(56, 140); x.lineTo(56, 40); x.lineTo(76, 40); x.lineTo(104, 98);
    x.lineTo(104, 40); x.lineTo(124, 40); x.lineTo(124, 140); x.lineTo(104, 140);
    x.lineTo(76, 82); x.lineTo(76, 140); x.closePath(); x.fill();
    var l = document.createElement('link');
    l.rel = 'apple-touch-icon'; l.sizes = '180x180'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
<script>
/* 玻璃透明度：0–100，預設 40 */
function glassLevel() { let v = 40; try { const n = parseInt(localStorage.getItem('NF_GLASS')); if (n >= 0 && n <= 100) v = n; } catch (e) {} return v; }
function applyGlass() {
  const L = glassLevel(), r = document.documentElement.style;
  r.setProperty('--gd', 'rgba(255,255,255,' + (0.05 + L * 0.0012).toFixed(3) + ')');
  r.setProperty('--gl', 'rgba(0,0,0,' + (0.04 + L * 0.001).toFixed(3) + ')');
}
function setGlass(v) { try { localStorage.setItem('NF_GLASS', v); } catch (e) {} applyGlass(); }
applyGlass();
</script>
</head>
<body>

<div class="fab-btn" id="fabBtn" onclick="openRandomRecommendation()" title="隨機推薦">
  <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect><circle cx="8.5" cy="8.5" r=".6"></circle><circle cx="15.5" cy="8.5" r=".6"></circle><circle cx="12" cy="12" r=".6"></circle><circle cx="8.5" cy="15.5" r=".6"></circle><circle cx="15.5" cy="15.5" r=".6"></circle></svg>
</div>

<header class="mobile-header">
  <div class="header-center-box"><div class="brand-logo" onclick="refreshAndHome()">Netflav</div></div>
</header>

<div id="appContent" class="page-overflow-wrapper">
  <div class="page-container" id="pageContainer">
    <div id="page1" class="page-content active-page">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">為您推薦</h2>
        <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded tracking-tighter">0 ITEMS</span>
      </div>
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="搜尋標題、女優或番號..." class="search-input">
        <svg id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>
      <div id="filterRow" class="filter-row"></div>
      <div id="gallery" class="grid gap-3"></div>
      <div id="paginationContainer" class="page-dot-container mt-6"></div>
    </div>
    <div id="page2" class="page-content">
      <h2 class="text-2xl font-bold mb-6 px-2">影片標籤</h2>
      <div id="tagCloud" class="flex flex-wrap gap-3 px-2"></div>
      <div id="tagPaginationContainer" class="page-dot-container mt-6"></div>
    </div>
    <div id="page3" class="page-content">
      <h2 class="text-2xl font-bold mb-6 px-2">所有女優</h2>
      <div id="dupBanner"></div>
      <div id="actorList" class="grid grid-cols-3 gap-y-6 gap-x-2 text-center"></div>
      <div id="actorPaginationContainer" class="page-dot-container mt-6"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchTab(0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>首頁</span>
  </div>
  <div class="nav-item" onclick="switchTab(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path><path d="M7 7h.01"></path></svg><span>標籤</span>
  </div>
  <div class="nav-item" onclick="switchTab(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>女優</span>
  </div>
  <div class="nav-item" onclick="toggleFilterDrawer(true)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.17a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>設定</span>
  </div>
</nav>

<div id="randomModal" class="keep-dark fixed inset-0 bg-black/95 z-[7000] hidden items-center justify-center p-6">
  <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl overflow-hidden p-6 text-center relative shadow-2xl">
    <h3 class="text-xs font-bold text-red-600 tracking-widest uppercase mb-4">✨ Today隨機推薦 ✨</h3>
    <div id="randomCardPreview" class="poster-card mb-4"></div>
    <p id="randomCardTitle" class="text-sm font-bold truncate text-white mb-6 px-1"></p>
    <div class="flex gap-3">
      <button onclick="openRandomRecommendation()" class="flex-1 bg-zinc-800 py-3 rounded-lg font-bold text-xs text-zinc-300">換一部</button>
      <button id="randomPlayBtn" class="flex-1 bg-red-600 py-3 rounded-lg font-bold text-xs text-white shadow-lg">立即觀看</button>
    </div>
    <button onclick="closeRandomModal()" class="absolute top-4 right-4 text-zinc-500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
  </div>
</div>

<div id="drawer" class="drawer">
  <div class="flex items-center justify-between mb-8">
    <h3 class="text-xl font-bold">影片資訊</h3>
    <button onclick="closeDrawer()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
  </div>
  <div class="space-y-6">
    <button id="pasteBtn" onclick="pasteFromClipboard()" class="w-full py-3 bg-zinc-900 rounded-lg text-xs font-bold text-zinc-300">從剪貼簿貼上</button>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">標題</label><input type="text" id="nameInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">女優（空白分隔）</label><input type="text" id="actorInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">番號</label><input type="text" id="codeInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">連結</label><input type="text" id="urlInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">標籤（空白分隔）</label><input type="text" id="tagsInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">封面圖片</label><input type="text" id="imgInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none"></div>
    <button id="favToggle" onclick="toggleDrawerFav()" class="w-full py-3 bg-zinc-900 rounded-lg text-sm font-bold text-white flex items-center justify-center gap-2"></button>
    <div class="pt-10 space-y-4">
      <button onclick="saveItem()" class="w-full bg-red-600 py-4 font-bold rounded-lg shadow-lg text-white">儲存內容</button>
      <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full py-2 text-zinc-600 text-xs font-bold hidden">刪除此項目</button>
    </div>
  </div>
</div>

<div id="filterDrawer" class="drawer">
  <div class="flex items-center justify-between mb-8">
    <h3 id="settingsTitle" class="text-xl font-bold" style="-webkit-touch-callout:none">帳戶設定</h3>
    <button onclick="toggleFilterDrawer(false)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
  </div>
  <div class="space-y-4">
    <button onclick="toggleFilterDrawer(false); openDrawer();" class="w-full py-4 bg-zinc-900 rounded font-bold text-white">新增影片</button>
    <button id="advBtn" onclick="toggleAdvanced()" class="w-full py-4 bg-zinc-900 rounded font-bold flex items-center justify-center gap-2 text-white"><span>進階</span><svg id="advArrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
    <div id="advancedBox" class="hidden space-y-4">
      <div class="bg-zinc-950 p-4 rounded-lg border border-zinc-900">
        <label class="block text-[10px] text-zinc-500 font-bold mb-3 uppercase tracking-widest">外觀</label>
        <div class="layout-grid">
          <button id="themeBtnDark" onclick="setTheme('dark')" class="layout-option">深色</button>
          <button id="themeBtnLight" onclick="setTheme('light')" class="layout-option">淺色</button>
        </div>        <label class="block text-[10px] text-zinc-500 font-bold mt-4 mb-2 uppercase tracking-widest">玻璃透明度</label>
        <input type="range" id="glassRange" min="0" max="100" step="1" oninput="setGlass(this.value)">
      </div>
      <div class="bg-zinc-950 p-4 rounded-lg border border-zinc-900">
        <label class="block text-[10px] text-zinc-500 font-bold mb-3 uppercase tracking-widest">切換 app 時遮蓋畫面</label>
        <div class="layout-grid" style="grid-template-columns:repeat(2,1fr)">
          <button id="coverBtnOn" onclick="setCover(true)" class="layout-option">開啟</button>
          <button id="coverBtnOff" onclick="setCover(false)" class="layout-option">關閉</button>
        </div>
        <p class="text-[11px] text-zinc-400 mt-3 leading-relaxed">切到別的 app 或進入多工畫面時，用空白畫面蓋住內容，避免縮圖露出封面。</p>
      </div>
      <div class="bg-zinc-950 p-4 rounded-lg border border-zinc-900">
        <label class="block text-[10px] text-zinc-500 font-bold mb-3 uppercase tracking-widest">顯示佈局</label>
        <div class="layout-grid">
          <button id="layoutBtn1" onclick="updateLayout(1)" class="layout-option">1 欄</button>
          <button id="layoutBtn2" onclick="updateLayout(2)" class="layout-option">2 欄</button>
          <button id="layoutBtn3" onclick="updateLayout(3)" class="layout-option">3 欄</button>
          <button id="layoutBtn4" onclick="updateLayout(4)" class="layout-option">4 欄</button>
        </div>
      </div>
      <div class="bg-zinc-950 p-4 rounded-lg border border-zinc-900">
        <label class="block text-[10px] text-zinc-500 font-bold mb-3 uppercase tracking-widest">每頁顯示數量（頁面長度）</label>
        <div class="layout-grid">
          <button id="sizeBtn6" onclick="updatePageSize(6)" class="layout-option">6 部</button>
          <button id="sizeBtn12" onclick="updatePageSize(12)" class="layout-option">12 部</button>
          <button id="sizeBtn24" onclick="updatePageSize(24)" class="layout-option">24 部</button>
          <button id="sizeBtn48" onclick="updatePageSize(48)" class="layout-option">48 部</button>
        </div>
      </div>
      <div id="cloudBox" class="hidden bg-zinc-950 p-4 rounded-lg border border-zinc-900">
        <label class="block text-[10px] text-zinc-500 font-bold mb-3 uppercase tracking-widest">雲端自動備份（GitHub Gist）</label>
        <p id="cloudStatus" class="text-xs text-zinc-400 mb-3 leading-relaxed"></p>
        <input type="password" id="tokenInput" placeholder="貼上 GitHub 權杖" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="w-full bg-zinc-900 p-3 rounded-lg text-white outline-none mb-3">
        <button onclick="saveToken()" class="w-full py-3 mb-2 bg-red-600 rounded-lg text-xs font-bold text-white">儲存權杖並連結</button>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="backupToCloudNow()" class="py-3 bg-zinc-800 rounded-lg text-xs font-bold text-zinc-200">立即備份</button>
          <button onclick="restoreFromCloud()" class="py-3 bg-zinc-800 rounded-lg text-xs font-bold text-zinc-200">從雲端還原</button>
          <button onclick="removeToken()" class="py-3 bg-zinc-800 rounded-lg text-xs font-bold text-zinc-400">移除權杖</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="precacheCovers()" class="py-4 bg-zinc-900 rounded font-bold text-sm text-white">預先下載封面</button>
        <button onclick="clearCoverCache()" class="py-4 bg-zinc-900 rounded font-bold text-sm text-white">清除封面快取</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="exportData()" class="py-4 bg-zinc-900 rounded font-bold text-white">匯出備份</button>
        <label class="block py-4 bg-zinc-900 rounded font-bold text-center cursor-pointer">匯入備份 <input type="file" class="hidden" accept=".json" onchange="importData(event)"></label>
      </div>
    </div>
  </div>
</div>

<div id="tagBar" class="tag-bar glassy keep-dark">
  <span id="tagBarText"></span>
  <button onclick="clearTags()" class="tag-bar-clear">清除</button>
  <button onclick="applyTags()" class="tag-bar-go">查看</button>
</div>
<div id="avatarModal" class="fixed inset-0 hidden items-end justify-center z-[7000]" style="background:rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)" onclick="if(event.target===this)closeAvatarEditor()">
  <div class="keep-dark glassy w-full" style="border-radius:28px 28px 0 0;padding:20px 16px calc(24px + var(--safe-bottom));max-height:90vh;overflow-y:auto">
    <p id="avatarTitle" class="text-center text-sm font-bold mb-4"></p>
    <div id="avatarPreview" class="actor-badge overflow-hidden" style="width:96px;height:96px;margin:0 auto 16px"></div>
    <label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">別名（空白或逗號分隔）</label>
    <input type="text" id="avatarAliases" placeholder="例如：另一種寫法、日文名、中文名" autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full bg-zinc-900 p-3 rounded-lg text-white outline-none mb-1" style="font-size:16px">
    <p class="text-[11px] text-zinc-400 mb-4 leading-relaxed">這些名字的作品會合併顯示在這位女優底下，搜尋也找得到。</p>
    <label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">圖片網址（選填）</label>
    <input type="text" id="avatarUrl" oninput="updateAvatarPreview()" placeholder="https://..." autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full bg-zinc-900 p-3 rounded-lg text-white outline-none mb-4" style="font-size:16px">
    <label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">預設造型</label>
    <div id="avatarStyles" class="avatar-styles"></div>
    <div class="grid grid-cols-2 gap-3 mt-6">
      <button onclick="resetAvatar()" class="py-3 bg-zinc-800 rounded-lg text-xs font-bold text-zinc-200">清除設定</button>
      <button onclick="saveAvatar()" class="py-3 bg-red-600 rounded-lg text-xs font-bold text-white">儲存</button>
    </div>
  </div>
</div>
<div id="dupModal" class="fixed inset-0 hidden items-end justify-center z-[7000]" style="background:rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)" onclick="if(event.target===this)closeDupModal()">
  <div class="keep-dark glassy w-full" style="border-radius:28px 28px 0 0;padding:20px 16px calc(24px + var(--safe-bottom));max-height:85vh;overflow-y:auto">
    <p class="text-center text-sm font-bold">可能重複的女優</p>
    <p class="text-[11px] text-zinc-400 text-center mt-2 mb-4 leading-relaxed">這些名字使用同一張頭像，可能是同一個人。選一個當主要名字，其他會變成它的別名並合併顯示。</p>
    <div id="dupList" onclick="const b=event.target.closest('[data-g]'); if(b) mergeDupGroup(+b.dataset.g, +b.dataset.n)"></div>
    <button onclick="closeDupModal()" class="w-full mt-4 py-3 bg-zinc-800 rounded-lg text-xs font-bold text-zinc-200">關閉</button>
  </div>
</div>
<div id="pageModal" class="fixed inset-0 hidden items-end justify-center z-[7000]" style="background:rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)" onclick="if(event.target===this)closePagePicker()">
  <div class="keep-dark glassy w-full" style="border-radius:28px 28px 0 0;padding:20px 16px calc(24px + var(--safe-bottom))">
    <p class="text-center text-sm font-bold">跳到第幾頁</p>
    <div id="pageGrid" class="page-grid"></div>
  </div>
</div>
<div id="confirmModal" class="keep-dark fixed inset-0 bg-black/95 z-[7500] hidden items-center justify-center p-8">
  <div class="text-center"><h4 id="confirmTitle" class="text-xl font-bold mb-8 leading-relaxed">確定要刪除嗎？</h4>
    <div class="flex flex-col items-center gap-4"><button id="confirmOkBtn" class="w-64 bg-red-600 py-4 font-bold rounded-lg text-white">確定</button><button onclick="closeConfirm()" class="w-64 py-4 font-bold rounded-lg bg-zinc-800 text-zinc-300">取消</button></div>
  </div>
</div>
<div id="toast"></div>
<div id="privacyCover" aria-hidden="true"><span class="brand-logo">Netflav</span></div>
<div id="undoBar"><span id="undoMsg"></span><button id="undoBtn" onclick="doUndo()">復原</button></div>

<script src="app.js"></script>
</body>
</html>
