<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE - Obsidian Gold Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,900;1,900&family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --mag-black: #0a0a0a;
            --mag-dark: #111111;
            --mag-white: #f0f0f0;
            --mag-accent: #c5a059;
            --mag-gray: #222222;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--mag-black);
            color: var(--mag-white);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .serif-bold { font-family: 'Noto Serif TC', serif; }
        .bodoni { font-family: 'Bodoni Moda', serif; }

        /* 啟動封面 */
        #landingCover {
            position: fixed;
            inset: 0;
            background-color: var(--mag-black);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #landingCover.hidden { transform: scale(1.1); opacity: 0; pointer-events: none; }

        /* 抽屜樣式 */
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            background-color: #0d0d0d;
            border-left: 1px solid var(--mag-gray);
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }

        /* 不同抽屜的寬度 */
        #filterDrawer { width: 280px; }
        #drawer { width: 100%; max-width: 600px; }

        /* 卡片設計 */
        .entry-card {
            background: var(--mag-dark);
            border: 1px solid var(--mag-gray);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .entry-card:hover {
            transform: translateY(-8px);
            border-color: var(--mag-accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .media-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
            border-bottom: 1px solid var(--mag-gray);
        }
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            opacity: 0.8;
            transition: opacity 0.3s;
            cursor: pointer;
            z-index: 10;
        }

        .action-btn {
            height: 32px;
            padding: 0 12px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid var(--mag-gray);
            border-radius: 6px;
            color: var(--mag-accent);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .action-btn:hover { 
            background: var(--mag-accent); 
            color: #000; 
        }

        /* 標籤樣式 */
        .filter-tag {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .filter-tag.active {
            background: rgba(197, 160, 89, 0.1);
            color: var(--mag-accent);
            border-color: rgba(197, 160, 89, 0.2);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--mag-accent); border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <!-- 啟動封面 -->
    <div id="landingCover">
        <div class="text-center px-6">
            <h1 class="text-6xl md:text-9xl serif-bold text-[#c5a059] leading-none mb-4">ARCHIVE</h1>
            <p class="bodoni text-lg italic text-zinc-500 tracking-[0.4em]">OBSIDIAN GOLD EDITION</p>
            <button id="enterBtn" onclick="enterVault()" class="mt-12 border border-[#c5a059] text-[#c5a059] px-12 py-4 text-[10px] font-black tracking-[0.5em] uppercase transition-all hover:bg-[#c5a059] hover:text-black">解密進入</button>
        </div>
    </div>

    <!-- 導航欄 -->
    <nav class="container mx-auto px-6 py-8 flex justify-between items-center border-b border-zinc-900">
        <div class="flex items-center gap-6">
            <button onclick="toggleFilterDrawer(true)" class="text-[#c5a059] hover:text-white transition-colors">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h2 class="serif-bold text-3xl text-white tracking-tighter">THE ARCHIVE<span class="text-[#c5a059]">.</span></h2>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="openDrawer()" class="bg-[#c5a059] text-black px-6 py-3 font-black text-[10px] tracking-[0.2em] uppercase hover:bg-white transition-all shadow-lg">
                + 新增檔案
            </button>
        </div>
    </nav>

    <!-- 畫廊 -->
    <div class="container mx-auto px-6 mt-12">
        <main id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></main>
    </div>

    <!-- 遮罩 -->
    <div id="overlay" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/90 opacity-0 pointer-events-none transition-opacity duration-500 z-50 backdrop-blur-md"></div>

    <!-- 篩選抽屜 -->
    <div id="filterDrawer" class="drawer p-8">
        <div class="flex justify-between items-center mb-10">
            <h3 class="serif-bold text-xl text-white uppercase tracking-widest">篩選器</h3>
            <button onclick="toggleFilterDrawer(false)" class="text-zinc-500">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="space-y-6">
            <input type="text" id="searchInput" oninput="renderGallery(false)" placeholder="搜尋..." class="w-full bg-black/40 border border-zinc-800 rounded-lg p-3 text-xs text-white outline-none focus:border-[#c5a059]">
            <div id="filterTagsContainer"></div>
        </div>
    </div>

    <!-- 編輯抽屜 -->
    <div id="drawer" class="drawer p-10">
        <div class="flex justify-between items-center mb-10">
            <h3 class="serif-bold text-3xl text-white">檔案詳情</h3>
            <button onclick="closeDrawer()" class="text-zinc-500">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="space-y-8">
            <input type="text" id="nameInput" placeholder="名稱" class="w-full bg-transparent border-b border-zinc-800 py-3 text-xl outline-none focus:border-[#c5a059]">
            <input type="text" id="codeInput" placeholder="番號" class="w-full bg-transparent border-b border-zinc-800 py-3 text-white outline-none focus:border-[#c5a059]">
            <input type="text" id="tagsInput" placeholder="標籤 (以空格分隔)" class="w-full bg-transparent border-b border-zinc-800 py-3 text-white outline-none focus:border-[#c5a059]">
            <input type="text" id="imgInput" placeholder="圖片連結" class="w-full bg-transparent border-b border-zinc-800 py-3 text-xs outline-none focus:border-[#c5a059]">
            <input type="text" id="videoInput" placeholder="影片連結" class="w-full bg-transparent border-b border-zinc-800 py-3 text-xs outline-none focus:border-[#c5a059]">
            <input type="text" id="urlInput" placeholder="外部連結" class="w-full bg-transparent border-b border-zinc-800 py-3 text-xs outline-none focus:border-[#c5a059]">
            <button onclick="saveItem()" class="w-full bg-[#c5a059] text-black py-4 font-black uppercase tracking-widest hover:bg-white transition-all">保存</button>
            <button id="drawerDeleteBtn" onclick="deleteItem()" class="w-full text-zinc-600 text-xs uppercase hidden">刪除此檔案</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#c5a059] text-black px-8 py-3 text-[10px] font-black rounded-full opacity-0 transition-opacity z-[100]"></div>

    <script>
        const STORAGE_KEY = 'VAULT_OFFLINE_DATA_V1';
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null;
        let selectedFilterTags = new Set();

        function enterVault() {
            document.getElementById('landingCover').classList.add('hidden');
        }

        function toggleFilterDrawer(open) {
            const drawer = document.getElementById('filterDrawer');
            const overlay = document.getElementById('overlay');
            if(open) {
                drawer.classList.add('open');
                overlay.classList.replace('opacity-0', 'opacity-100');
                overlay.classList.remove('pointer-events-none');
            } else {
                drawer.classList.remove('open');
                overlay.classList.replace('opacity-100', 'opacity-0');
                overlay.classList.add('pointer-events-none');
            }
        }

        function openDrawer(id = null) {
            currentId = id;
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.add('open');
            overlay.classList.replace('opacity-0', 'opacity-100');
            overlay.classList.remove('pointer-events-none');

            if(id) {
                const item = collections.find(i => i.id == id);
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('videoInput').value = item.video || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
            } else {
                ['nameInput','codeInput','tagsInput','imgInput','videoInput','urlInput'].forEach(k => document.getElementById(k).value = "");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
            }
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('overlay').classList.add('pointer-events-none');
        }

        function closeAllDrawers() {
            toggleFilterDrawer(false);
            closeDrawer();
        }

        function saveItem() {
            const name = document.getElementById('nameInput').value;
            if(!name) return;
            const data = {
                id: currentId || Date.now(),
                name,
                code: document.getElementById('codeInput').value,
                tags: document.getElementById('tagsInput').value.split(' ').filter(t => t),
                img: document.getElementById('imgInput').value,
                video: document.getElementById('videoInput').value,
                url: document.getElementById('urlInput').value
            };
            if(currentId) {
                const idx = collections.findIndex(i => i.id == currentId);
                collections[idx] = data;
            } else {
                collections.unshift(data);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery();
            closeDrawer();
            showToast("已保存");
        }

        function deleteItem() {
            if(!confirm("確定刪除？")) return;
            collections = collections.filter(i => i.id != currentId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery();
            closeDrawer();
            showToast("已刪除");
        }

        function toggleTag(tag) {
            if(selectedFilterTags.has(tag)) selectedFilterTags.delete(tag);
            else selectedFilterTags.add(tag);
            renderGallery(false);
        }

        function renderGallery(refreshTags = true) {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            gallery.innerHTML = "";

            if(refreshTags) {
                const tagCounts = {};
                collections.forEach(i => (i.tags || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
                const container = document.getElementById('filterTagsContainer');
                container.innerHTML = "";
                Object.keys(tagCounts).sort().forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = `filter-tag ${selectedFilterTags.has(tag) ? 'active' : ''}`;
                    btn.innerHTML = `<span># ${tag}</span><span>${tagCounts[tag]}</span>`;
                    btn.onclick = () => toggleTag(tag);
                    container.appendChild(btn);
                });
            }

            const filtered = collections.filter(i => {
                const matchSearch = i.name.toLowerCase().includes(query) || (i.code || "").toLowerCase().includes(query);
                const matchTags = selectedFilterTags.size === 0 || (i.tags || []).some(t => selectedFilterTags.has(t));
                return matchSearch && matchTags;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "entry-card";
                card.innerHTML = `
                    <div class="media-wrapper">
                        <img src="${item.img || 'https://via.placeholder.com/400x225/111/c5a059?text=NO+IMAGE'}" onerror="this.src='https://via.placeholder.com/400x225/111/c5a059?text=ERROR'">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="serif-bold text-lg text-white mb-1 uppercase truncate">${item.name}</h3>
                        <p class="text-[10px] text-[#c5a059] font-mono mb-4">${item.code || "N/A"}</p>
                        <div class="mt-auto flex justify-between gap-2">
                            <button onclick="openDrawer(${item.id})" class="action-btn flex-grow">編輯</button>
                            ${item.url ? `<button onclick="window.open('${item.url}')" class="action-btn flex-grow">查看</button>` : ''}
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2000);
        }

        renderGallery();
    </script>
</body>
</html>
