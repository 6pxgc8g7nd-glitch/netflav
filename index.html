<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE ARCHIVE | 檔案庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,900;1,900&family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --mag-black: #0a0a0a;
            --mag-dark: #151515;
            --mag-white: #f0f0f0;
            --mag-accent: #c5a059;
            --mag-gray: #2a2a2a;
            --nav-height: 80px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--mag-black);
            color: var(--mag-white);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .serif-bold { font-family: 'Noto Serif TC', serif; }

        nav.sticky-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            z-index: 100;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            display: flex;
            align-items: center;
        }

        #appContent { padding-top: var(--nav-height); }

        .nav-tool-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--mag-accent);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 32px;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap;
        }
        .nav-tool-btn:hover {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--mag-accent);
            color: white;
        }

        .nav-btn-primary { background: var(--mag-accent); color: black; border: 1px solid var(--mag-accent); }

        #authOverlay {
            position: fixed; inset: 0;
            background-color: var(--mag-black);
            z-index: 500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        #patternCanvas { cursor: crosshair; touch-action: none; }

        .drawer {
            position: fixed; top: 0; right: 0; height: 100%;
            background-color: #161616;
            border-left: 1px solid var(--mag-gray);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 200;
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }

        .entry-card {
            background: var(--mag-dark);
            border: 1px solid var(--mag-gray);
            border-radius: 12px;
            transition: all 0.4s;
            display: flex; flex-direction: column; height: 100%;
        }
        .entry-card:hover {
            transform: translateY(-8px);
            border-color: var(--mag-accent);
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.15);
        }

        .page-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--mag-gray);
            font-weight: 700; font-size: 11px; transition: all 0.3s;
            background: #000; color: #666;
        }
        .page-btn.active { background: var(--mag-accent); border-color: var(--mag-accent); color: #000; }

        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 解鎖介面 -->
    <div id="authOverlay">
        <div class="text-center mb-6 px-4">
            <h2 class="serif-bold text-2xl text-white tracking-[0.2em] uppercase">檔案存取控制</h2>
            <p id="authStatusText" class="text-[10px] text-zinc-500 uppercase tracking-[0.3em] mt-3">請繪製解鎖圖形</p>
        </div>
        <div id="patternBox">
            <canvas id="patternCanvas" width="320" height="320"></canvas>
        </div>
        <button onclick="resetPattern()" class="mt-8 text-[10px] text-zinc-600 hover:text-white tracking-widest uppercase">清除繪製</button>
    </div>

    <!-- 導航欄 -->
    <nav class="sticky-header" id="mainNav" style="display: none;">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center">
            <div class="flex items-center gap-3 md:gap-6">
                <button onclick="toggleFilterDrawer(true)" class="text-[#c5a059] p-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="flex flex-col">
                    <h2 class="serif-bold text-lg md:text-xl text-white tracking-tighter">THE ARCHIVE<span class="text-[#c5a059]">.</span></h2>
                    <span id="navStat" class="text-[8px] md:text-[9px] font-black text-zinc-600 tracking-widest">載入中...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- 匯入與導出按鈕 -->
                <button onclick="exportData()" class="nav-tool-btn px-2 md:px-4" title="導出 JSON 備份">導出</button>
                <label class="nav-tool-btn px-2 md:px-4 cursor-pointer">
                    導入 <input type="file" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <div class="w-px h-4 bg-zinc-800 mx-1"></div>
                <button onclick="openDrawer()" class="nav-tool-btn nav-btn-primary px-3 md:px-6">新增</button>
            </div>
        </div>
    </nav>

    <!-- 主內容 -->
    <div id="appContent" style="display: none;">
        <div class="container mx-auto px-6 mt-10">
            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            <div id="paginationContainer" class="my-16 flex justify-center items-center gap-2"></div>
        </div>
    </div>

    <!-- 搜尋與篩選抽屜 -->
    <div id="filterDrawer" class="drawer p-8 w-[320px] md:w-[350px]">
        <div class="flex justify-between items-center mb-10">
            <h3 class="serif-bold text-xl text-white uppercase tracking-widest">搜尋工具</h3>
            <button onclick="toggleFilterDrawer(false)" class="text-zinc-500 hover:text-white text-xl">✕</button>
        </div>
        <div class="space-y-8">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest">關鍵字 (名稱、番號)</label>
                <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋關鍵字..." class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-sm text-white focus:border-[#c5a059] outline-none">
            </div>
            <div class="space-y-4">
                <label class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest">標籤快選</label>
                <div id="filterTagsContainer" class="flex flex-wrap gap-2"></div>
            </div>
            <button onclick="clearFilters()" class="w-full py-3 text-[10px] text-zinc-500 border border-zinc-800 rounded-lg hover:bg-zinc-900 transition-all font-bold">重置篩選</button>
        </div>
    </div>

    <!-- 編輯抽屜 -->
    <div id="drawer" class="drawer p-10 w-full max-w-[500px]">
        <div class="flex justify-between items-center mb-10">
            <h3 class="serif-bold text-2xl text-white uppercase tracking-wider">編輯紀錄</h3>
            <button onclick="closeDrawer()" class="text-zinc-500 hover:text-white text-xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-600 uppercase font-bold">標題 / 女優名稱</label>
                <input type="text" id="nameInput" class="w-full bg-transparent border-b border-zinc-800 py-3 text-xl text-white outline-none focus:border-[#c5a059]">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-600 uppercase font-bold">番號 (序列碼)</label>
                <input type="text" id="codeInput" class="w-full bg-transparent border-b border-zinc-800 py-3 text-white outline-none focus:border-[#c5a059]">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-600 uppercase font-bold">標籤 (以空格分隔)</label>
                <input type="text" id="tagsInput" class="w-full bg-transparent border-b border-zinc-800 py-3 text-white outline-none focus:border-[#c5a059]">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-600 uppercase font-bold">圖片 URL</label>
                <input type="text" id="imgInput" oninput="previewImage(this.value)" class="w-full bg-transparent border-b border-zinc-800 py-3 text-zinc-500 text-xs outline-none">
            </div>
            <div id="editPreview" class="w-full aspect-video bg-zinc-900 flex items-center justify-center rounded-xl overflow-hidden border border-zinc-800"></div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-600 uppercase font-bold">外部跳轉連結</label>
                <input type="text" id="urlInput" class="w-full bg-transparent border-b border-zinc-800 py-3 text-[#c5a059] text-xs outline-none">
            </div>
            <div class="pt-8 space-y-4">
                <button onclick="saveItem()" class="w-full bg-[#c5a059] text-black py-4 font-black uppercase text-xs tracking-widest hover:bg-white transition-all">更新紀錄</button>
                <button id="deleteBtn" onclick="deleteItem()" class="w-full text-red-900 text-[10px] font-bold uppercase hover:text-red-500 transition-colors hidden">刪除紀錄</button>
            </div>
        </div>
    </div>

    <!-- 遮罩與通知 -->
    <div id="overlay" onclick="closeAll()" class="fixed inset-0 bg-black/80 opacity-0 pointer-events-none transition-all z-[150] backdrop-blur-sm"></div>
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#c5a059] text-black px-8 py-3 text-[10px] font-black rounded-full opacity-0 transition-all z-[600] tracking-widest pointer-events-none">系統提示</div>

    <script>
        // --- 解鎖邏輯 ---
        const CORRECT_PATTERN = "0124678"; 
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, selectedNodes = [], mousePos = { x: 0, y: 0 };
        const nodes = [];
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) nodes.push({ id: (i * 3 + j).toString(), x: 60 + j * 100, y: 60 + i * 100 });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (selectedNodes.length > 0) {
                ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle = '#c5a059'; ctx.moveTo(nodes[selectedNodes[0]].x, nodes[selectedNodes[0]].y);
                selectedNodes.forEach(id => ctx.lineTo(nodes[id].x, nodes[id].y));
                if (isDrawing) ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
            }
            nodes.forEach(node => {
                const active = selectedNodes.includes(node.id);
                ctx.beginPath(); ctx.arc(node.x, node.y, 10, 0, Math.PI * 2);
                ctx.strokeStyle = active ? '#c5a059' : '#333'; ctx.stroke();
                if(active) { ctx.beginPath(); ctx.arc(node.x, node.y, 4, 0, Math.PI * 2); ctx.fillStyle = '#c5a059'; ctx.fill(); }
            });
            requestAnimationFrame(draw);
        }

        const getPos = e => {
            const r = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - r.left, y: clientY - r.top };
        };

        const handleStart = e => { isDrawing = true; selectedNodes = []; mousePos = getPos(e); };
        const handleMove = e => {
            if (!isDrawing) return;
            mousePos = getPos(e);
            nodes.forEach(n => {
                if (Math.hypot(mousePos.x - n.x, mousePos.y - n.y) < 25 && !selectedNodes.includes(n.id)) {
                    selectedNodes.push(n.id);
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            });
        };
        const handleEnd = () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (selectedNodes.join('') === CORRECT_PATTERN) unlock();
            else if(selectedNodes.length > 0) { 
                document.getElementById('patternBox').classList.add('shake');
                setTimeout(() => { document.getElementById('patternBox').classList.remove('shake'); selectedNodes = []; }, 500);
            }
        };

        canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e); }); window.addEventListener('touchmove', handleMove); window.addEventListener('touchend', handleEnd);
        draw();

        function unlock() {
            sessionStorage.setItem('unlocked', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainNav').style.display = 'flex';
            document.getElementById('appContent').style.display = 'block';
            renderGallery();
        }

        // --- 核心與搜尋 ---
        let collections = JSON.parse(localStorage.getItem('VAULT_DATA')) || [];
        let currentEditId = null;
        let selectedFilterTags = new Set();
        let currentPage = 1;
        const pageSize = 12;

        function debounce(func, delay = 400) {
            let timer;
            return (...args) => { clearTimeout(timer); timer = setTimeout(() => func(...args), delay); };
        }
        const debouncedRender = debounce(() => { currentPage = 1; renderGallery(); });

        function renderGallery() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const normQuery = query.replace(/[^a-z0-9]/g, '');

            const filtered = collections.filter(item => {
                const matchesTags = selectedFilterTags.size === 0 || Array.from(selectedFilterTags).every(t => (item.tags || []).includes(t));
                if (!matchesTags) return false;
                if (!query) return true;
                const nameMatch = item.name.toLowerCase().includes(query);
                const code = (item.code || "").toLowerCase();
                const codeMatch = code.includes(query) || (normQuery && code.replace(/[^a-z0-9]/g, '').includes(normQuery));
                return nameMatch || codeMatch;
            });

            const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
            if(currentPage > totalPages) currentPage = totalPages;
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

            document.getElementById('navStat').innerText = `已載入 ${filtered.length} 筆`;
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = paginated.length ? "" : `<div class="col-span-full py-40 text-center text-zinc-700 uppercase tracking-widest">無相符紀錄</div>`;

            paginated.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "entry-card fade-in";
                div.style.animationDelay = `${i * 0.05}s`;
                div.innerHTML = `
                    <div class="aspect-video bg-black overflow-hidden rounded-t-xl">
                        <img src="${item.img || 'https://via.placeholder.com/400x225/111/333?text=EMPTY'}" class="w-full h-full object-cover opacity-80" loading="lazy">
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        <h4 class="serif-bold text-white truncate text-base">${item.name}</h4>
                        <p class="text-[9px] text-[#c5a059] font-bold tracking-widest mt-1">${item.code || "---"}</p>
                        <div class="mt-auto pt-6 flex gap-2">
                            <button onclick="openDrawer('${item.id}')" class="flex-1 py-2 bg-zinc-900 text-zinc-500 text-[10px] font-bold rounded">編輯</button>
                            ${item.url ? `<button onclick="window.open('${item.url}')" class="flex-1 py-2 bg-[#c5a059]/10 text-[#c5a059] text-[10px] font-bold rounded border border-[#c5a059]/20 hover:bg-[#c5a059] hover:text-black">連結</button>` : ''}
                        </div>
                    </div>`;
                gallery.appendChild(div);
            });
            renderPagination(totalPages);
            renderFilterTags();
        }

        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            container.innerHTML = "";
            if (total <= 1) return;
            for (let i = 1; i <= total; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; window.scrollTo({top:0, behavior:'smooth'}); renderGallery(); };
                container.appendChild(btn);
            }
        }

        function renderFilterTags() {
            const counts = {};
            collections.forEach(item => (item.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
            const container = document.getElementById('filterTagsContainer');
            container.innerHTML = "";
            Object.keys(counts).sort().forEach(tag => {
                const active = selectedFilterTags.has(tag);
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded text-[9px] font-bold border transition-all ${active ? 'bg-[#c5a059] border-[#c5a059] text-black' : 'bg-black border-zinc-800 text-zinc-500'}`;
                btn.innerText = `${tag} (${counts[tag]})`;
                btn.onclick = () => { active ? selectedFilterTags.delete(tag) : selectedFilterTags.add(tag); currentPage = 1; renderGallery(); };
                container.appendChild(btn);
            });
        }

        // --- 功能操作 ---
        function openDrawer(id = null) {
            currentEditId = id;
            document.getElementById('deleteBtn').classList.toggle('hidden', !id);
            if (id) {
                const item = collections.find(i => i.id == id);
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code;
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img;
                document.getElementById('urlInput').value = item.url;
                previewImage(item.img);
            } else {
                ['nameInput', 'codeInput', 'tagsInput', 'imgInput', 'urlInput'].forEach(i => document.getElementById(i).value = "");
                previewImage("");
            }
            document.getElementById('drawer').classList.add('open');
            showOverlay(true);
        }

        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return showToast("標題不能為空");
            const data = {
                id: currentEditId || Date.now().toString(),
                name,
                code: document.getElementById('codeInput').value.trim().toUpperCase(),
                tags: document.getElementById('tagsInput').value.split(/\s+/).filter(t => t),
                img: document.getElementById('imgInput').value.trim(),
                url: document.getElementById('urlInput').value.trim()
            };
            if (currentEditId) {
                const idx = collections.findIndex(i => i.id == currentEditId);
                collections[idx] = data;
            } else collections.unshift(data);
            localStorage.setItem('VAULT_DATA', JSON.stringify(collections));
            renderGallery(); closeAll(); showToast("數據已儲存");
        }

        function deleteItem() {
            if (!confirm("確定永久刪除此紀錄？")) return;
            collections = collections.filter(i => i.id != currentEditId);
            localStorage.setItem('VAULT_DATA', JSON.stringify(collections));
            renderGallery(); closeAll(); showToast("紀錄已刪除");
        }

        function exportData() {
            if (collections.length === 0) return showToast("無數據可導出");
            const blob = new Blob([JSON.stringify(collections, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `archive_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast("導出成功");
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`即將導入 ${imported.length} 筆數據，這將覆蓋現有內容，確定嗎？`)) {
                            collections = imported;
                            localStorage.setItem('VAULT_DATA', JSON.stringify(collections));
                            renderGallery();
                            showToast("數據導入成功");
                        }
                    } else showToast("格式錯誤：必須是數組");
                } catch(err) { showToast("無效的 JSON 檔案"); }
                e.target.value = ''; // 清除 input 以利重複導入
            };
            reader.readAsText(file);
        }

        function clearFilters() {
            document.getElementById('searchInput').value = "";
            selectedFilterTags.clear();
            currentPage = 1;
            renderGallery();
        }

        function showOverlay(v) { 
            const o = document.getElementById('overlay');
            o.classList.toggle('opacity-0', !v); o.classList.toggle('pointer-events-none', !v); 
        }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); showOverlay(false); }
        function toggleFilterDrawer(v) { document.getElementById('filterDrawer').classList.toggle('open', v); showOverlay(v); }
        function closeAll() { closeDrawer(); toggleFilterDrawer(false); }
        function previewImage(url) { document.getElementById('editPreview').innerHTML = url ? `<img src="${url}" class="w-full h-full object-cover">` : `<span class="text-zinc-800 text-[10px]">PREVIEW</span>`; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 2500); }
        function resetPattern() { selectedNodes = []; }

        if (sessionStorage.getItem('unlocked') === 'true') unlock();
    </script>
</body>
</html>
