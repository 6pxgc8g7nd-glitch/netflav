<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>netflav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --nf-black: #000000;
            --nf-dark: #141414;
            --nf-red: #E50914;
            --nf-white: #FFFFFF;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --icon-size: 20px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--nf-black);
            color: var(--nf-white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* 靜態 LED 狀態指示燈 */
        .status-led {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px currentColor;
            transition: color 0.3s, background-color 0.3s;
        }
        .led-active { color: #22c55e; background-color: #22c55e; }
        .led-paused { color: #ef4444; background-color: #ef4444; }

        .page-overflow-wrapper { width: 100%; overflow: hidden; }
        /* 修正高度撐開問題 */
        .page-container { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); min-height: 100vh; align-items: flex-start; }
        .page-content { width: 33.3333%; padding: calc(var(--nav-height) + 20px) 16px 140px 16px; box-sizing: border-box; height: auto; max-height: 100vh; overflow: hidden; }
        .page-content.active-page { max-height: none; overflow: visible; }

        .mobile-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            backdrop-filter: blur(10px);
            padding: 0 20px;
        }
        .header-center-box { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; }
        .brand-logo { color: var(--nf-red); font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; }
        .brand-logo:active { opacity: 0.6; }
        .led-trigger { position: absolute; right: 0; padding: 10px; cursor: pointer; display: flex; align-items: center; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom));
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; padding-bottom: var(--safe-bottom); border-top: 1px solid #222;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #71717a; transition: color 0.2s; height: 100%;
        }
        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 10px; font-weight: 600; margin-top: 5px; line-height: 1; }
        .nav-item svg { width: var(--icon-size); height: var(--icon-size); }

        .poster-card {
            position: relative; background: #111; border-radius: 8px; overflow: hidden;
            aspect-ratio: 16 / 9; width: 100%; margin-bottom: 8px;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .action-circle-btn {
            position: absolute; width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 50; border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; transition: transform 0.2s;
            cursor: pointer; pointer-events: auto;
        }
        .action-circle-btn:active { transform: scale(0.9); }
        .card-edit-btn { top: 10px; right: 10px; }
        .card-play-btn { bottom: 10px; right: 10px; }
        .card-play-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
            pointer-events: none;
            z-index: 10;
        }

        .page-dot-container {
            display: flex; gap: 12px; justify-content: center; align-items: center;
            padding: 20px 0; overflow-x: auto; scrollbar-width: none;
        }
        .page-dot {
            min-width: 36px; height: 36px; border-radius: 50%;
            background-color: #1a1a1e; color: #71717a;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        .page-dot.active { background-color: var(--nf-red); color: white; transform: scale(1.1); box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }

        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background-color: var(--nf-black); transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; overflow-y: auto; padding: 25px;
        }
        .drawer.open { transform: translateY(0); }

        .search-container { position: relative; margin-bottom: 1.5rem; }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: var(--icon-size); height: var(--icon-size); color: #71717a; pointer-events: none; }
        .search-input { width: 100%; background-color: #18181b; border: none; border-radius: 8px; padding: 0.85rem 1rem 0.85rem 3rem; font-size: 0.875rem; color: white; outline: none; }

        #authOverlay { position: fixed; inset: 0; background-color: var(--nf-black); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .actor-badge { background: #1a1a1a; border-radius: 50%; width: 80px; height: 80px; margin: 0 auto 8px; border: 1px solid #2a2a2a; }
        .tag-pill { background: #1a1a1a; color: #ccc; padding: 10px 18px; border-radius: 4px; font-size: 13px; font-weight: 500; border: 1px solid #333; }
        
        .input-error { color: #ef4444 !important; }
        .input-ring-error { ring: 1px solid #ef4444 !important; }

        .stealth-toggle {
            margin-top: 2rem; display: flex; align-items: center; gap: 8px;
            font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
        }
        .stealth-toggle input { display: none; }
        .stealth-toggle .box { width: 12px; height: 12px; border: 1px solid #333; border-radius: 2px; position: relative; }
        .stealth-toggle input:checked + .box::after { content: ''; position: absolute; inset: 2px; background: var(--nf-red); }
    </style>
</head>
<body>

    <div id="authOverlay">
        <h1 class="brand-logo mb-10 tracking-widest">Netflav</h1>
        <div id="patternContainer">
            <div id="patternBox"><canvas id="patternCanvas" width="300" height="300"></canvas></div>
        </div>
        <p id="authHint" class="text-[10px] text-zinc-600 mt-12 uppercase tracking-[0.3em]">請繪製圖形解鎖</p>
        
        <label class="stealth-toggle">
            <input type="checkbox" id="stealthMode">
            <div class="box"></div>
            <span>隱形繪製模式</span>
        </label>
    </div>

    <header class="mobile-header" id="mainHeader" style="visibility: hidden;">
        <div class="header-center-box">
            <div class="brand-logo" id="logoTitle" onclick="refreshAndHome()">Netflav</div>
            <div class="led-trigger" onclick="toggleAutoLogout()">
                <span id="statusLed" class="status-led led-active"></span>
            </div>
        </div>
    </header>

    <div id="appContent" class="page-overflow-wrapper" style="visibility: hidden;">
        <div class="page-container" id="pageContainer">
            <div id="page1" class="page-content active-page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">為您推薦</h2>
                    <span id="itemCount" class="text-[10px] text-zinc-500 font-bold bg-zinc-900 px-2 py-1 rounded tracking-tighter">0 ITEMS</span>
                </div>
                
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" oninput="debouncedRender()" placeholder="搜尋影片、番號或演員..." class="search-input">
                </div>

                <div id="gallery" class="grid grid-cols-1 gap-4"></div>
                <div id="paginationContainer" class="page-dot-container mt-8"></div>
            </div>

            <div id="page2" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">影片標籤</h2>
                <div id="tagCloud" class="flex flex-wrap gap-3 px-2"></div>
            </div>
            
            <div id="page3" class="page-content">
                <h2 class="text-2xl font-bold mb-10 px-2">所有演員</h2>
                <div id="actorList" class="grid grid-cols-3 gap-y-10 gap-x-2 text-center"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="visibility: hidden;">
        <div class="nav-item active" id="navHome" onclick="switchTab(0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首頁</span>
        </div>
        <div class="nav-item" id="navTags" onclick="switchTab(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path><path d="M7 7h.01"></path>
            </svg>
            <span>標籤</span>
        </div>
        <div class="nav-item" id="navActor" onclick="switchTab(2)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>演員</span>
        </div>
        <div class="nav-item" onclick="openDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>新增</span>
        </div>
        <div class="nav-item" onclick="toggleFilterDrawer(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.17a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>設定</span>
        </div>
    </nav>

    <div id="drawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">影片資訊</h3>
            <button onclick="closeDrawer()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="space-y-6">
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">名稱 / 演員</label><input type="text" id="nameInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none focus:ring-1 focus:ring-red-600"></div>
            <div>
                <label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest flex justify-between">
                    番號 (ID) <span id="codeError" class="text-red-500 hidden">此番號已存在</span>
                </label>
                <input type="text" id="codeInput" oninput="validateCode(this.value)" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none focus:ring-1 focus:ring-red-600" placeholder="例如: ABC-123">
            </div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">觀看連結 (URL)</label><input type="text" id="urlInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none focus:ring-1 focus:ring-red-600"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">標籤 (空格分隔)</label><input type="text" id="tagsInput" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none focus:ring-1 focus:ring-red-600"></div>
            <div><label class="block text-[10px] text-zinc-500 font-bold mb-2 uppercase tracking-widest">封面圖片路徑</label><input type="text" id="imgInput" oninput="previewImage(this.value)" class="w-full bg-zinc-900 p-4 rounded-lg text-white outline-none focus:ring-1 focus:ring-red-600"></div>
            <div id="editPreview" class="aspect-[16/9] w-full bg-zinc-900 rounded-lg overflow-hidden flex items-center justify-center text-[10px] text-zinc-700">PREVIEW</div>
            <div class="pt-10 space-y-4">
                <button onclick="saveItem()" class="w-full bg-red-600 py-4 font-bold rounded-lg shadow-lg">儲存內容</button>
                <button id="drawerDeleteBtn" onclick="requestDelete()" class="w-full py-2 text-zinc-600 text-xs font-bold hidden">刪除此項目</button>
            </div>
        </div>
    </div>

    <div id="filterDrawer" class="drawer">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-bold">帳戶設定</h3>
            <button onclick="toggleFilterDrawer(false)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="space-y-4">
            <button onclick="exportData()" class="w-full py-4 bg-zinc-900 rounded font-bold">匯出備份</button>
            <label class="block w-full py-4 bg-zinc-900 rounded font-bold text-center cursor-pointer">
                匯入備份 <input type="file" class="hidden" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="lockApp()" class="w-full py-4 text-red-600 font-bold">立即登出鎖定</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/95 z-[6000] hidden flex items-center justify-center p-8">
        <div class="text-center">
            <h4 class="text-xl font-bold mb-8">確定要刪除嗎？</h4>
            <div class="flex flex-col gap-4">
                <button onclick="executeDelete()" class="w-64 bg-red-600 py-4 font-bold rounded-lg">刪除</button>
                <button onclick="closeConfirm()" class="py-2 text-zinc-500">取消</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2 rounded-full text-xs font-bold z-[7000] opacity-0 transition-all pointer-events-none"></div>

    <script>
        const CORRECT_PATTERN = "0124678";
        const STORAGE_KEY = 'NF_MOBILE_VAULT_FINAL';
        let collections = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentId = null, currentPage = 1, pageSize = 12;
        let isDrawing = false, selectedNodes = [], mousePos = { x: 0, y: 0 };
        let isErrorState = false;
        const nodes = [];

        // --- 功能模組：首頁刷新 ---
        function refreshAndHome() {
            document.getElementById('searchInput').value = "";
            currentPage = 1;
            renderGallery();
            switchTab(0); // 會觸發修正後的切換邏輯
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 自動登出計時邏輯 ---
        let logoutTimer = null;
        let isAutoLogoutPaused = false;
        const AUTO_LOGOUT_SECONDS = 5; 

        function resetLogoutTimer() {
            const isLocked = document.getElementById('authOverlay').style.display !== 'none';
            if (isAutoLogoutPaused || isLocked) {
                if (logoutTimer) clearTimeout(logoutTimer);
                return;
            }
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => {
                lockApp();
                showToast("閒置過久，已自動登出");
            }, AUTO_LOGOUT_SECONDS * 1000);
        }

        function toggleAutoLogout() {
            isAutoLogoutPaused = !isAutoLogoutPaused;
            const led = document.getElementById('statusLed');
            
            if (isAutoLogoutPaused) {
                clearTimeout(logoutTimer);
                led.className = "status-led led-paused";
                showToast("自動登出已暫停");
            } else {
                led.className = "status-led led-active";
                showToast("自動登出已恢復");
                resetLogoutTimer();
            }
        }

        ['mousedown', 'touchstart', 'mousemove', 'keydown', 'scroll', 'click'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (document.getElementById('authOverlay').style.display === 'none') {
                    resetLogoutTimer();
                }
            }, { passive: true });
        });

        // --- 圖形鎖邏輯 ---
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                nodes.push({ id: (i * 3 + j).toString(), x: 50 + j * 100, y: 50 + i * 100 });
            }
        }

        function drawPattern() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isStealth = document.getElementById('stealthMode').checked;
            if (selectedNodes.length > 0 && (!isStealth || isErrorState)) {
                ctx.beginPath();
                ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = isErrorState ? '#ff0000' : '#E50914';
                const start = nodes.find(n => n.id === selectedNodes[0]);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < selectedNodes.length; i++) {
                    const nodeA = nodes.find(n => n.id === selectedNodes[i-1]);
                    const nodeB = nodes.find(n => n.id === selectedNodes[i]);
                    const xc = (nodeA.x + nodeB.x) / 2;
                    const yc = (nodeA.y + nodeB.y) / 2;
                    ctx.quadraticCurveTo(nodeA.x, nodeA.y, xc, yc);
                    ctx.lineTo(nodeB.x, nodeB.y);
                }
                if (isDrawing && !isErrorState) ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
            }
            nodes.forEach(node => {
                const active = selectedNodes.includes(node.id);
                ctx.beginPath();
                ctx.arc(node.x, node.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = active ? (isErrorState ? '#ff0000' : '#E50914') : '#222';
                if (active || !isStealth) {
                    ctx.fill();
                    if (active) {
                        ctx.beginPath(); ctx.arc(node.x, node.y, 18, 0, Math.PI * 2);
                        ctx.strokeStyle = isErrorState ? 'rgba(255,0,0,0.3)' : 'rgba(229,9,20,0.2)';
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawPattern);
        }

        const handleStart = (e) => {
            if (isErrorState) return;
            e.preventDefault();
            isDrawing = true;
            selectedNodes = [];
        };

        const handleMove = (e) => {
            if (!isDrawing || isErrorState) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            mousePos = { 
                x: (touch.clientX - rect.left) * (canvas.width / rect.width), 
                y: (touch.clientY - rect.top) * (canvas.height / rect.height)
            };
            nodes.forEach(node => { 
                if (Math.hypot(mousePos.x - node.x, mousePos.y - node.y) < 30 && !selectedNodes.includes(node.id)) {
                    selectedNodes.push(node.id);
                    if (window.navigator.vibrate) window.navigator.vibrate(10);
                } 
            });
        };

        const handleEnd = () => {
            if (!isDrawing || isErrorState) return;
            isDrawing = false;
            if (selectedNodes.join('') === CORRECT_PATTERN) unlockVault();
            else if (selectedNodes.length > 0) handleWrongPattern();
        };

        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        function handleWrongPattern() {
            isErrorState = true;
            document.getElementById('patternContainer').classList.add('shake');
            document.getElementById('authHint').innerText = "圖形錯誤，請重試";
            document.getElementById('authHint').classList.add('text-red-600');
            setTimeout(() => {
                document.getElementById('patternContainer').classList.remove('shake');
                selectedNodes = []; isErrorState = false;
                document.getElementById('authHint').innerText = "請繪製圖形解鎖";
                document.getElementById('authHint').classList.remove('text-red-600');
            }, 600);
        }
        drawPattern();

        function unlockVault() {
            sessionStorage.setItem('VAULT_UNLOCKED', 'true');
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.visibility = 'visible';
            document.getElementById('appContent').style.visibility = 'visible';
            document.getElementById('bottomNav').style.visibility = 'visible';
            isAutoLogoutPaused = false;
            document.getElementById('statusLed').className = "status-led led-active";
            renderGallery(); 
            resetLogoutTimer();
        }

        function lockApp() {
            sessionStorage.removeItem('VAULT_UNLOCKED');
            selectedNodes = []; isErrorState = false; isDrawing = false;
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('mainHeader').style.visibility = 'hidden';
            document.getElementById('appContent').style.visibility = 'hidden';
            document.getElementById('bottomNav').style.visibility = 'hidden';
            if (logoutTimer) clearTimeout(logoutTimer);
            toggleFilterDrawer(false);
            closeDrawer();
        }

        // --- 藝廊渲染 ---
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = collections.filter(i => 
                i.name.toLowerCase().includes(query) || (i.code || "").toLowerCase().includes(query) || (i.tags || []).some(t => t.toLowerCase().includes(query))
            );
            document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;
            const total = Math.ceil(filtered.length / pageSize);
            if (currentPage > total && total > 0) currentPage = total;
            const paginated = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            
            gallery.innerHTML = paginated.map(item => `
                <div class="poster-card">
                    <img src="${item.img || 'https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=640'}" loading="lazy" onerror="this.src='https://via.placeholder.com/640x360/111/333?text=NO+IMAGE'">
                    <div class="action-circle-btn card-edit-btn" onclick="openDrawer('${item.id}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </div>
                    ${item.url ? `<div class="action-circle-btn card-play-btn" onclick="openExternalUrl('${item.url}', event)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : ''}
                    <div class="card-overlay">
                        <p class="text-[9px] font-black text-red-600 mb-0.5 tracking-wider uppercase">${item.code || 'SERIES'}</p>
                        <p class="text-[13px] font-bold truncate pr-14">${item.name}</p>
                    </div>
                </div>
            `).join('');
            renderPagination(total);
        }

        function renderPagination(total) {
            const container = document.getElementById('paginationContainer');
            if (total <= 1) { container.innerHTML = ""; return; }
            let pages = [1];
            for (let i = Math.max(2, currentPage - 1); i <= Math.min(total - 1, currentPage + 1); i++) pages.push(i);
            if (total > 1) pages.push(total);
            const finalPages = [...new Set(pages)];
            container.innerHTML = finalPages.map(p => `<div onclick="changePage(${p})" class="page-dot ${p === currentPage ? 'active' : ''}">${p}</div>`).join('');
        }

        // --- 修正分頁高度與捲動問題 ---
        function switchTab(index) {
            const container = document.getElementById('pageContainer');
            const pages = document.querySelectorAll('.page-content');
            
            // 1. 執行橫向切換
            container.style.transform = `translateX(-${index * (100/3)}%)`;
            
            // 2. 更新導覽亮燈
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));
            
            // 3. 關鍵：管理分頁高度，確保隱藏頁面不撐開 Body 高度
            pages.forEach((page, i) => {
                if (i === index) {
                    page.classList.add('active-page');
                } else {
                    page.classList.remove('active-page');
                }
            });

            // 4. 強制捲動回最上方，避免殘留捲動位置
            window.scrollTo(0, 0);

            // 5. 資料渲染
            if(index === 1) renderTagCloud();
            if(index === 2) renderActorList();
        }

        function changePage(p) { currentPage = p; window.scrollTo({top:0, behavior:'smooth'}); renderGallery(); }
        function openExternalUrl(url, e) { if(e) e.stopPropagation(); window.open(url.startsWith('http') ? url : 'https://' + url, '_blank'); }
        function debouncedRender() { clearTimeout(window.timer); window.timer = setTimeout(renderGallery, 300); }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = "1"; t.style.transform = "translate(-50%, -10px)";
            setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translate(-50%, 0)"; }, 2000);
        }

        function openDrawer(id = null) {
            currentId = id; document.getElementById('drawer').classList.add('open');
            validateCode(""); 
            if(id) {
                const item = collections.find(i => String(i.id) === String(id));
                document.getElementById('nameInput').value = item.name;
                document.getElementById('codeInput').value = item.code || "";
                document.getElementById('urlInput').value = item.url || "";
                document.getElementById('tagsInput').value = (item.tags || []).join(' ');
                document.getElementById('imgInput').value = item.img || "";
                document.getElementById('drawerDeleteBtn').classList.remove('hidden');
                previewImage(item.img);
            } else {
                ['nameInput','codeInput','urlInput','tagsInput','imgInput'].forEach(k => document.getElementById(k).value = "");
                document.getElementById('drawerDeleteBtn').classList.add('hidden');
                previewImage("");
            }
        }

        function validateCode(val) {
            const code = val.trim().toUpperCase();
            const errorText = document.getElementById('codeError');
            const inputField = document.getElementById('codeInput');
            if (!code) { errorText.classList.add('hidden'); inputField.classList.remove('input-error', 'input-ring-error'); return; }
            const isDuplicate = collections.some(item => item.code === code && String(item.id) !== String(currentId));
            if (isDuplicate) { errorText.classList.remove('hidden'); inputField.classList.add('input-error', 'input-ring-error'); }
            else { errorText.classList.add('hidden'); inputField.classList.remove('input-error', 'input-ring-error'); }
        }

        function saveItem() {
            const name = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            if(!name) { showToast("請輸入名稱"); return; }
            if (collections.some(item => item.code === code && code !== "" && String(item.id) !== String(currentId))) { showToast(`番號 ${code} 已存在`); return; }

            const data = { 
                id: currentId || Date.now().toString(), name, code, 
                url: document.getElementById('urlInput').value.trim(), 
                tags: document.getElementById('tagsInput').value.trim().split(/\s+/).filter(t => t), 
                img: document.getElementById('imgInput').value.trim() 
            };
            if(currentId) collections[collections.findIndex(i => String(i.id) === String(currentId))] = data;
            else collections.unshift(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(collections));
            renderGallery(); closeDrawer(); showToast("已儲存");
        }

        function executeDelete() { collections = collections.filter(i => String(i.id) !== String(currentId)); localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); closeConfirm(); closeDrawer(); renderGallery(); showToast("已刪除"); }
        function requestDelete() { document.getElementById('confirmModal').classList.remove('hidden'); }
        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
        function toggleFilterDrawer(open) { document.getElementById('filterDrawer').classList.toggle('open', open); }
        
        function previewImage(url) { 
            const container = document.getElementById('editPreview');
            if (!url) { container.innerHTML = "PREVIEW"; return; }
            container.innerHTML = `<img src="${url}" class="w-full h-full object-cover rounded" onerror="this.src='https://via.placeholder.com/640x360/111/333?text=INVALID+IMAGE'">`; 
        }

        function exportData() { 
            const blob = new Blob([JSON.stringify(collections, null, 2)], {type: 'application/json'}); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = `netflav.json`; 
            a.click(); 
        }

        function importData(e) { 
            const reader = new FileReader(); 
            reader.onload = (ev) => { 
                try { 
                    const data = JSON.parse(ev.target.result); 
                    if (Array.isArray(data)) { 
                        collections = data; 
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(collections)); 
                        renderGallery(); 
                        showToast("匯入成功"); 
                    } 
                } catch(err) { 
                    showToast("匯入失敗：格式錯誤"); 
                } 
            }; 
            reader.readAsText(e.target.files[0]); 
        }

        function renderTagCloud() { 
            const container = document.getElementById('tagCloud'); 
            const map = {}; 
            collections.forEach(i => (i.tags || []).forEach(tag => map[tag] = (map[tag] || 0) + 1)); 
            const sortedTags = Object.entries(map).sort((a,b) => b[1] - a[1]); 
            container.innerHTML = sortedTags.map(([tag, count]) => `
                <div onclick="filterBySearch('${tag}')" class="tag-pill active:scale-95 transition-transform">
                    ${tag} <span class="ml-1 text-[10px] opacity-40">${count}</span>
                </div>
            `).join(''); 
        }

        function renderActorList() { 
            const list = document.getElementById('actorList'); 
            const map = {}; 
            collections.forEach(i => { 
                const names = i.name.split(/[\s,，、/]+/).filter(n => n.trim() && n.length > 1); 
                names.forEach(n => map[n] = (map[n] || 0) + 1); 
            }); 
            const sorted = Object.entries(map).sort((a,b) => b[1] - a[1]); 

            list.innerHTML = sorted.map(([name, count]) => {
                let displayName = "";
                if (name.match(/^[A-Za-z]/)) {
                    displayName = name.substring(0, 2).toUpperCase();
                } else {
                    displayName = name.length > 3 ? name.substring(0, 2) : name.substring(0, 1);
                }

                return `
                <div onclick="filterBySearch('${name}')" class="active:opacity-70 flex flex-col items-center">
                    <div class="actor-badge overflow-hidden flex items-center justify-center bg-zinc-800 border-zinc-700 shadow-inner">
                        <span class="text-xl font-black text-zinc-500 tracking-tighter">${displayName}</span>
                    </div>
                    <span class="text-xs font-bold block truncate px-2 mt-2 w-full text-center">${name}</span>
                    <span class="block text-[9px] text-zinc-600 mt-0.5">${count} 作品</span>
                </div>
                `;
            }).join(''); 
        }

        function filterBySearch(val) { 
            document.getElementById('searchInput').value = val; 
            switchTab(0); 
            renderGallery(); 
        }

        window.onload = () => { 
            if(sessionStorage.getItem('VAULT_UNLOCKED') === 'true') {
                unlockVault();
            }
        };
    </script>
</body>
</html>
